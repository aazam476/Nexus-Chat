# Every directory under apps/ and packages/ with a package.json is a
# workspace. The Go apps have no package.json and are ignored here.
packages:
  - apps/*
  - packages/*
# Dependency install scripts are off unless listed here. @parcel/watcher is
# an optional native file watcher Jest uses only in watch mode; it works
# without its build step, so the script stays disabled.
allowBuilds:
  "@parcel/watcher": false

# Security overrides for transitive dependencies, removed once the parent
# package ships the fix itself (see docs/dependencies.md).
overrides:
  # High-severity CPU-exhaustion advisories in js-yaml < 4.3.2, reached
  # through @hey-api/openapi-ts. Same major version, so no API change.
  "js-yaml@>=4.0.0 <4.3.2": 4.3.2
  # eslint-plugin-tsdoc pins @typescript-eslint/utils 8.56.1, which predates
  # TypeScript 6 support. Use the same version as the rest of the lint
  # toolchain (same major version).
  "eslint-plugin-tsdoc>@typescript-eslint/utils": 8.72.1
