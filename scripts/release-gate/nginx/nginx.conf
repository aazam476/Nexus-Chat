# Nginx in front of Nexus Chat, as in docs/self-hosting.md. The release
# gate runs it with a throwaway certificate for nexus.test.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name nexus.test;
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # Above the default 25 MB attachment limit, plus encryption overhead.
    client_max_body_size 30m;

    location / {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        # WebSocket upgrade, for the real-time gateway and LiveKit signaling.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }
}
