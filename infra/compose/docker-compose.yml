# Nexus Chat: the whole instance in three containers (spec §3.2).
#
#   1. Put this file and .env (copied from .env.example) in one folder.
#   2. Set ADMIN_EMAIL and POSTGRES_PASSWORD in .env.
#   3. Run: docker compose up -d
#   4. Read the setup token: docker compose logs server
#   5. Open http://<this machine>:8080/setup
#
# P2P call mode also needs coturn: docker compose --profile p2p up -d
# Full guide: docs/self-hosting.md
name: nexus-chat

services:
  server:
    image: ghcr.io/aazam476/nexus-chat-server:${NEXUS_VERSION:-beta}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DOMAIN: ${DOMAIN:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${HTTPS_PORT:-8443}:8443"
    volumes:
      - ${DATA_DIR:-./data}/server:/data
    healthcheck:
      test: ["CMD", "/nexus-chat-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  postgres:
    image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexuschat
      POSTGRES_DB: nexuschat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 images keep their data in a versioned folder below
      # this path, which makes major-version upgrades safer.
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexuschat -d nexuschat"]
      interval: 5s
      timeout: 5s
      retries: 12

  livekit:
    image: livekit/livekit-server:v1.13.11@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20
    restart: unless-stopped
    # The server writes livekit.yaml (with generated keys) before it reports
    # healthy, so LiveKit starts after it.
    depends_on:
      server:
        condition: service_healthy
    # Same user as the server, so the owner-only config file is readable.
    user: "65532:65532"
    command: ["--config", "/etc/livekit/livekit.yaml"]
    volumes:
      - ${DATA_DIR:-./data}/server/livekit:/etc/livekit:ro
    ports:
      - "7881:7881/tcp" # WebRTC over TCP
      - "7882:7882/udp" # WebRTC media (all calls share this port)
      - "3478:3478/udp" # built-in TURN

  coturn:
    profiles: [p2p]
    image: coturn/coturn:4.18.0@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    user: "65532:65532"
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ${DATA_DIR:-./data}/server/coturn:/etc/coturn:ro
    ports:
      - "3479:3479/udp"
      - "3479:3479/tcp"
      - "49160-49200:49160-49200/udp" # relayed media
