# Continuous integration. Every check that would otherwise live in a git
# hook (format, lint, tests) runs here, and every job must pass on main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOLANGCI_LINT_VERSION: v2.15.0
  GOBCO_VERSION: v1.3.4
  GO_LICENSES_VERSION: v2.0.1
  GOVULNCHECK_VERSION: v1.9.0
  GREMLINS_VERSION: v0.6.0
  MAESTRO_VERSION: 2.12.1
  # SHA-256 of maestro.zip from the official cli-2.12.1 release.
  MAESTRO_SHA256: 54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7
  TRIVY_VERSION: 0.76.2
  # SHA-256 of trivy_0.76.2_Linux-64bit.tar.gz from the official release.
  # Pinned here so a replaced download cannot run in CI.
  TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: [apps/server, apps/push-relay]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Install Go tools
        run: |
          go install github.com/rillig/gobco@${GOBCO_VERSION}
          go install github.com/google/go-licenses/v2@${GO_LICENSES_VERSION}
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
      - name: Generated code is up to date
        working-directory: ${{ matrix.module }}
        run: |
          go generate ./...
          git diff --exit-code -- . || { echo "Run 'go generate ./...' and commit the result."; exit 1; }
      - name: Lint and format
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.module }}
      - name: Tests with race detector and coverage gates
        # Database tests start PostgreSQL with Testcontainers (Docker is
        # available on GitHub-hosted Ubuntu runners).
        run: scripts/go-coverage.sh ${{ matrix.module }}
      - name: Fuzz parsers of untrusted input
        run: scripts/go-fuzz.sh ${{ matrix.module }} 30
      - name: License check
        run: scripts/check-licenses.sh go ${{ matrix.module }}
      - name: Vulnerability scan
        working-directory: ${{ matrix.module }}
        run: govulncheck ./...

  visual:
    name: Worst-case UI and visual snapshots
    runs-on: ubuntu-24.04
    # The official Playwright image, pinned by digest: the snapshots in
    # tests/e2e were taken in it, and other fonts or browsers render
    # differently.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Build the web client
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @nexus-chat/api-client build
          pnpm --filter @nexus-chat/client build:web
      - name: Every screen with demo and worst-case data
        run: pnpm --filter @nexus-chat/e2e visual
        env:
          NEXUS_VISUAL_SNAPSHOTS: "1"
          NEXUS_E2E_WORKERS: "4"
      - name: Keep the differences for review
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-differences
          path: tests/e2e/test-results
          retention-days: 14

  android:
    name: Android app (Maestro)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_PASSWORD: maestro
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: Start a fresh instance on port 8080
        run: |
          (cd apps/server && go build -o "$RUNNER_TEMP/nexus-chat-server" ./cmd/nexus-chat-server)
          mkdir -p "$RUNNER_TEMP/data"
          DATABASE_URL="postgres://postgres:maestro@localhost:5432/postgres?sslmode=disable" \
            DATA_DIR="$RUNNER_TEMP/data" ADMIN_EMAIL=admin@example.com HTTP_PORT=8080 \
            nohup "$RUNNER_TEMP/nexus-chat-server" > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 30); do
            token=$(grep -o '"setup_token":"[A-Z2-7-]*"' "$RUNNER_TEMP/server.log" | cut -d'"' -f4 || true)
            [ -n "$token" ] && break
            sleep 1
          done
          [ -n "$token" ] || { cat "$RUNNER_TEMP/server.log"; exit 1; }
          echo "SETUP_TOKEN=$token" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the release APK (plain HTTP allowed for the test instance only)
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @nexus-chat/api-client build
          cd apps/client
          NEXUS_E2E_CLEARTEXT=1 CI=1 npx expo prebuild --platform android --no-install
          cd android && ./gradlew --no-daemon assembleRelease
      - name: Install Maestro (checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Maestro flows on an Android emulator
        uses: ReactiveCircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: scripts/maestro-android.sh apps/client/android/app/build/outputs/apk/release/app-release.apk "$SETUP_TOKEN"
      - name: Keep the server log and Maestro report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-android
          path: |
            ${{ runner.temp }}/server.log
            maestro-report.xml
            ~/.maestro/tests
          retention-days: 14

  mutation:
    name: Mutation testing (auth)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - run: go install github.com/go-gremlins/gremlins/cmd/gremlins@${GREMLINS_VERSION}
      - name: At least 70% of mutants caught in every critical package
        run: scripts/go-mutation.sh apps/server

  javascript:
    name: TypeScript
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated code is up to date
        run: |
          pnpm generate
          git diff --exit-code || { echo "Run 'pnpm generate' and commit the result."; exit 1; }
      - name: Lint and format
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: MLS interop test vectors (pinned and checksum-verified)
        run: scripts/fetch-mls-vectors.sh
      - name: Tests with coverage gates
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: License check
        run: PATH="$PWD/node_modules/.bin:$PATH" scripts/check-licenses.sh js .
      - name: License check rejects GPL (self-test)
        run: |
          if PATH="$PWD/node_modules/.bin:$PATH" scripts/check-licenses.sh js scripts/license-fixtures/gpl-dependency; then
            echo "The license check accepted a GPL dependency; it is broken."
            exit 1
          fi
      - name: Vulnerability scan
        run: pnpm audit --audit-level high
      - name: Advisories against the MLS library, including unreviewed ones
        run: scripts/check-mls-advisories.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

  images:
    name: Images and release gate
    runs-on: ubuntu-24.04
    needs: [go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/server.Dockerfile
          load: true
          tags: ghcr.io/aazam476/nexus-chat-server:ci
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - name: Build push relay image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/push-relay.Dockerfile
          load: true
          tags: ghcr.io/aazam476/nexus-chat-push-relay:ci
          cache-from: type=gha,scope=push-relay
          cache-to: type=gha,scope=push-relay,mode=max
      - name: Install Trivy (checksum verified)
        run: scripts/install-trivy.sh "$TRIVY_VERSION" "$TRIVY_SHA256"
      - name: Scan images (fail on critical vulnerabilities)
        run: |
          for image in nexus-chat-server nexus-chat-push-relay; do
            trivy image --exit-code 1 --severity CRITICAL --no-progress "ghcr.io/aazam476/$image:ci"
          done
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install the browser test tools
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @nexus-chat/e2e exec playwright install --with-deps chromium
      - name: Build the desktop app for its test
        run: |
          pnpm --filter @nexus-chat/api-client build
          pnpm --filter @nexus-chat/client build:web
          pnpm --filter @nexus-chat/desktop build
      - name: Allow Chromium's sandbox
        # Ubuntu 24.04 blocks the unprivileged user namespaces that
        # Electron's sandbox uses; the test keeps the sandbox on.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Release gate over localhost (with the desktop app and ZAP)
        run: xvfb-run -a scripts/release-gate.sh plain ci
      - name: Release gate through HTTPS reverse proxies
        run: |
          for proxy in caddy nginx traefik; do
            scripts/release-gate.sh "$proxy" ci
          done

  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history, not just the last commit
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache: false
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: gitleaks git --redact --verbose .
