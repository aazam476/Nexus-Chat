# Publishes signed, multi-architecture images when a version tag such as
# v0.1.0-beta.1 is pushed (spec §3.1). Nothing is pushed unless the image
# passes the vulnerability scan and both release-gate runs first.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  TRIVY_VERSION: 0.76.2
  TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf

jobs:
  verify:
    name: Scan and release gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/server.Dockerfile
          load: true
          tags: ghcr.io/aazam476/nexus-chat-server:release-candidate
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/push-relay.Dockerfile
          load: true
          tags: ghcr.io/aazam476/nexus-chat-push-relay:release-candidate
      - run: scripts/install-trivy.sh "$TRIVY_VERSION" "$TRIVY_SHA256"
      - run: |
          for image in nexus-chat-server nexus-chat-push-relay; do
            trivy image --exit-code 1 --severity CRITICAL --no-progress "ghcr.io/aazam476/$image:release-candidate"
          done
      - run: scripts/release-gate.sh plain release-candidate
      - run: |
          for proxy in caddy nginx traefik; do
            scripts/release-gate.sh "$proxy" release-candidate
          done

  publish:
    name: Publish ${{ matrix.image }}
    needs: [verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signing
    strategy:
      matrix:
        include:
          - image: nexus-chat-server
            dockerfile: infra/docker/server.Dockerfile
          - image: nexus-chat-push-relay
            dockerfile: infra/docker/push-relay.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/aazam476/${{ matrix.image }}
          # 0.1.0-beta.1 always; "beta" for beta tags; "latest" only for
          # stable releases (no "-" in the version).
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-beta') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The SBOM and build provenance are attached to the image as
          # attestations.
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image (keyless, via GitHub's OIDC identity)
        run: cosign sign --yes "ghcr.io/aazam476/${{ matrix.image }}@${{ steps.build.outputs.digest }}"
