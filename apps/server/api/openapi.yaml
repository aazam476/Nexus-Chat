openapi: 3.0.3
info:
  title: Nexus Chat Server API
  version: 0.1.0
  description: |
    The HTTP API of a Nexus Chat instance. This file is the contract: Go
    server interfaces and the TypeScript client are generated from it.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /
tags:
  - name: health
    description: Liveness and readiness probes used by Docker and orchestrators.
  - name: setup
    description: First-run setup of a fresh instance (spec §3.5).
  - name: auth
    description: Logging in and out, and managing sessions (spec §4.1).
  - name: users
    description: User accounts and profiles.
  - name: instance
    description: Public information about this instance.
  - name: admin
    description: Instance administration. Every operation needs an instance admin.
  - name: encryption
    description: End-to-end encryption support. The server stores and relays opaque MLS data; it never sees keys or plaintext.
  - name: social
    description: Friends, blocks and privacy settings (spec §4.2).
  - name: conversations
    description: DMs and group DMs (spec §4.3). Messages travel encrypted through the encryption endpoints.
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Log in with a password
      description: |
        Checks the username (or email) and password and starts a session.
        After repeated wrong passwords the account is locked for a short,
        growing time; the response then has code `login_delayed` and a
        `Retry-After` header.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "202":
          description: |
            The password is right, but the account has a second factor. Send
            the challenge with a code to `POST /api/v1/auth/login/mfa` within
            five minutes. The challenge allows one attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaChallenge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The username or password is wrong (`invalid_credentials`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many attempts from this address (`rate_limited`) or for this account (`login_delayed`).
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/register:
    post:
      operationId: register
      summary: Create an account
      description: |
        Creates an account and logs it in. Whether this is allowed depends on
        the instance's registration mode: `open`, `invite_only` (needs
        `inviteCode`) or `closed`. A verification email is sent if the
        instance has email set up.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: The account exists and is logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Registration is not allowed (`registration_closed`, `invite_required` or `invalid_invite`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Confirm an email address
      description: Redeems the token from a verification email link.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "204":
          description: The address is verified.
        "400":
          description: The token is invalid or expired (`invalid_token`), or the body is malformed (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      summary: Send the verification email again
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "202":
          description: A new link is on its way. Older links stop working.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The address is already verified (`already_verified`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The instance cannot send email (`email_unavailable`); the message says why.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/password-reset:
    post:
      operationId: requestPasswordReset
      summary: Ask for a password reset link
      description: |
        Emails a reset link if the address has an account. The response is
        the same either way, so it does not reveal who is registered.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: If the address has an account, a link is on its way.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/password-reset/complete:
    post:
      operationId: completePasswordReset
      summary: Choose a new password
      description: |
        Sets a new password using the token from the reset link, and logs
        out every session of the account. This restores login only; it does
        not restore encryption keys.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletePasswordResetRequest"
      responses:
        "204":
          description: The password is changed. Log in again.
        "400":
          description: The token is invalid or expired (`invalid_token`), or the body is malformed (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/admin/invites:
    get:
      operationId: listInvites
      summary: List instance invites
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every invite, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createInvite
      summary: Create an instance invite
      description: The code is returned once and cannot be shown again.
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: The new invite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/admin/invites/{inviteId}:
    delete:
      operationId: deleteInvite
      summary: Revoke an instance invite
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The invite no longer works.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such invite (`invite_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/admin/tls:
    get:
      operationId: getTlsStatus
      summary: HTTPS certificate status
      description: |
        Whether the server serves HTTPS with an uploaded or mounted
        certificate, and which names it covers until when. An instance
        behind a reverse proxy shows `active: false` here.
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The certificate in use, if any.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TlsStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: installTlsCertificate
      summary: Upload an HTTPS certificate
      description: |
        Validates the certificate chain and private key (the key matches,
        the chain is complete and trusted, the certificate covers the
        instance domain and is currently valid), saves them and starts
        serving HTTPS without a restart. A rejected upload changes nothing.
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallTlsCertificateRequest"
      responses:
        "200":
          description: The certificate is now served.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TlsStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: |
            The certificate cannot be used (`certificate_rejected`); the
            message says why, for example a missing intermediate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: removeTlsCertificate
      summary: Remove the HTTPS certificate
      description: Deletes the certificate files and stops serving HTTPS. Plain HTTP keeps working.
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: HTTPS is off.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/smtp:
    get:
      operationId: getSmtpSettings
      summary: Mail server settings
      description: The password is never returned; `passwordSet` says whether one is stored.
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The current settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmtpSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateSmtpSettings
      summary: Change the mail server settings
      description: |
        Replaces the settings. Leaving out `password` keeps the stored one;
        an empty string removes it. The next email uses the new settings.
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSmtpSettingsRequest"
      responses:
        "200":
          description: The saved settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmtpSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/admin/smtp/test:
    post:
      operationId: sendTestEmail
      summary: Send a test email
      description: Sends a test email to the calling admin's own address with the saved settings.
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The mail server accepted the message.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: SMTP is not configured yet (`smtp_not_configured`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: |
            The mail server refused or could not be reached
            (`mail_delivery_failed`); the message has the server's reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/login/mfa:
    post:
      operationId: completeLoginMfa
      summary: Finish logging in with a second factor
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaLoginRequest"
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The code is wrong or the challenge expired (`invalid_second_factor`). Log in with the password again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/reauthenticate:
    post:
      operationId: reauthenticate
      summary: Confirm my password before a sensitive change
      description: |
        Marks this session as recently authenticated for 10 minutes, which
        changes to how the account logs in require (removing a second
        factor, adding a passkey, linking a provider). Accounts without a
        password log in again instead. Wrong passwords count towards the
        same per-account delays as login.
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthenticateRequest"
      responses:
        "204":
          description: Confirmed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The password is wrong (`invalid_credentials`), or the account has
            no password and must log in again (`no_password`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many attempts from this address (`rate_limited`) or for this account (`login_delayed`).
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/mfa:
    get:
      operationId: getSecondFactors
      summary: My second factors
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The account's authenticator apps and remaining backup codes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecondFactors"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/mfa/totp:
    post:
      operationId: enrollTotp
      summary: Start adding an authenticator app
      description: Returns a secret and an `otpauth://` URL to show as a QR code. Confirm with a code to finish.
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollTotpRequest"
      responses:
        "201":
          description: The pending authenticator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpEnrollment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/mfa/totp/{enrollmentId}/confirm:
    post:
      operationId: confirmTotp
      summary: Finish adding an authenticator app
      description: |
        Activates the authenticator. When it is the account's first second
        factor, the response includes ten backup codes, shown only this once.
      tags: [auth]
      security:
        - bearerAuth: []
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRequest"
      responses:
        "200":
          description: The authenticator is active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpConfirmation"
        "400":
          description: Wrong code (`invalid_code`), unknown setup (`enrollment_not_found`), or malformed body (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/mfa/totp/{authenticatorId}:
    delete:
      operationId: removeTotp
      summary: Remove an authenticator app
      tags: [auth]
      security:
        - bearerAuth: []
      parameters:
        - name: authenticatorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReauthenticationRequired"
        "404":
          description: No such authenticator (`authenticator_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/mfa/backup-codes:
    post:
      operationId: regenerateBackupCodes
      summary: Replace my backup codes
      description: Creates ten new backup codes. The old ones stop working.
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The new codes, shown only this once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupCodes"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReauthenticationRequired"
  /api/v1/auth/login/mfa/security-key/begin:
    post:
      operationId: beginSecurityKeyLogin
      summary: Start the security-key step of a login
      description: |
        Uses up the MFA challenge and returns WebAuthn options for
        `navigator.credentials.get()`. Finish with the ceremony ID.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeRequest"
      responses:
        "200":
          description: Pass `options` to the browser.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnCeremony"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The challenge is unknown or expired (`invalid_second_factor`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/WebAuthnUnavailable"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/login/mfa/security-key/finish:
    post:
      operationId: finishSecurityKeyLogin
      summary: Finish logging in with a security key
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnLoginAnswer"
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The key could not be verified or the request expired (`invalid_second_factor`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/passkey/begin:
    post:
      operationId: beginPasskeyLogin
      summary: Start logging in with a passkey
      description: No username or password is needed; the browser offers the passkeys it holds.
      tags: [auth]
      responses:
        "200":
          description: Pass `options` to `navigator.credentials.get()`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnCeremony"
        "409":
          $ref: "#/components/responses/WebAuthnUnavailable"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/passkey/finish:
    post:
      operationId: finishPasskeyLogin
      summary: Finish logging in with a passkey
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnLoginAnswer"
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The passkey could not be verified or the request expired (`invalid_passkey`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/webauthn:
    get:
      operationId: listWebAuthnCredentials
      summary: My security keys and passkeys
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every registered credential, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebAuthnCredential"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/webauthn/register/begin:
    post:
      operationId: beginWebAuthnRegistration
      summary: Start adding a security key or passkey
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnRegistrationRequest"
      responses:
        "200":
          description: Pass `options` to `navigator.credentials.create()`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnCeremony"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReauthenticationRequired"
        "409":
          $ref: "#/components/responses/WebAuthnUnavailable"
  /api/v1/auth/webauthn/register/finish:
    post:
      operationId: finishWebAuthnRegistration
      summary: Finish adding a security key or passkey
      description: |
        When this is the account's first second factor, the response
        includes ten backup codes, shown only this once.
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnRegistrationAnswer"
      responses:
        "201":
          description: The credential is registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpConfirmation"
        "400":
          description: The credential could not be verified (`invalid_credential`) or the request expired (`ceremony_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/webauthn/{credentialId}:
    delete:
      operationId: removeWebAuthnCredential
      summary: Remove a security key or passkey
      tags: [auth]
      security:
        - bearerAuth: []
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReauthenticationRequired"
        "404":
          description: No such credential (`credential_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/oidc/providers:
    get:
      operationId: listSignInProviders
      summary: Sign-in providers
      description: The providers the login page offers, sorted by name.
      tags: [auth]
      responses:
        "200":
          description: Every configured provider.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SignInProvider"
  /api/v1/auth/oidc/providers/{providerId}/begin:
    post:
      operationId: beginProviderSignIn
      summary: Start signing in with a provider
      description: |
        Returns the provider's sign-in address to open in a browser and a
        `flowId` the client keeps. The provider sends the browser back to
        `returnTo` with `#flow=...&code=...` (or `#error=...`); finish with
        `POST /api/v1/auth/oidc/complete` within ten minutes.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeginProviderSignInRequest"
      responses:
        "200":
          description: Open `authorizationUrl`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderFlow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "409":
          $ref: "#/components/responses/DomainRequired"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/ProviderUnavailable"
  /api/v1/auth/oidc/callback:
    get:
      operationId: providerCallback
      summary: Provider callback
      description: |
        Where providers send the browser after sign-in. Register the
        instance's base URL followed by this path at the provider. Always
        redirects to the address the client gave when it began, except
        for an unknown or used `state`.
      tags: [auth]
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Back to the client, with the result in the URL fragment.
          headers:
            Location:
              required: true
              schema:
                type: string
        "400":
          description: The sign-in link is unknown, used or expired (`invalid_state`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/oidc/complete:
    post:
      operationId: completeProviderSignIn
      summary: Finish signing in with a provider
      description: |
        Logs in the account linked to the provider login. If there is none
        and the provider allows sign-up, creates one first, following the
        registration mode. Accounts with a second factor get an MFA
        challenge, exactly as with `POST /api/v1/auth/login`.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteProviderSignInRequest"
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "202":
          description: The account has a second factor; continue with `POST /api/v1/auth/login/mfa`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaChallenge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The flow and code do not match a finished provider sign-in (`invalid_flow`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            No account can be used or created: `no_account` (sign-up is off
            for this provider), `registration_closed`, `invite_required`,
            `invalid_invite`, or `email_required` (the provider shared no
            email address).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            An account already uses this email (`email_in_use`): log in to
            it another way and link the provider in settings. Or the same
            provider login signed up twice at once (`identity_in_use`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/oidc/providers/{providerId}/link:
    post:
      operationId: beginProviderLink
      summary: Start linking a provider to my account
      description: Like `begin`, for the logged-in account. Finish with `POST /api/v1/auth/oidc/link/complete`.
      tags: [auth]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeginProviderLinkRequest"
      responses:
        "200":
          description: Open `authorizationUrl`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderFlow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReauthenticationRequired"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "409":
          $ref: "#/components/responses/DomainRequired"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/ProviderUnavailable"
  /api/v1/auth/oidc/link/complete:
    post:
      operationId: completeProviderLink
      summary: Finish linking a provider to my account
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteProviderLinkRequest"
      responses:
        "204":
          description: The provider login now signs in to this account.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: No valid session (`unauthorized`), or the flow and code do not match a link this account started (`invalid_flow`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            The provider login belongs to another account
            (`identity_in_use`), or this account is linked to a different
            login at the provider (`already_linked`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/oidc/identities:
    get:
      operationId: listLinkedProviders
      summary: Providers linked to my account
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The linked providers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LinkedProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/oidc/identities/{providerId}:
    delete:
      operationId: unlinkProvider
      summary: Unlink a provider from my account
      tags: [auth]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      responses:
        "204":
          description: The provider no longer signs in to this account.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReauthenticationRequired"
        "404":
          description: This account is not linked to that provider (`not_linked`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: It is the account's only way to log in (`last_login_method`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/admin/oidc-providers:
    get:
      operationId: listOidcProviders
      summary: List sign-in providers
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every provider, with the callback URL to register at each.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProviderList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createOidcProvider
      summary: Add a sign-in provider
      description: |
        The issuer's OpenID configuration is fetched before saving, so a
        mistyped issuer is reported as a validation error on `issuer`.
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOidcProviderRequest"
      responses:
        "201":
          description: The saved provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProvider"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A provider with this ID exists (`provider_exists`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/admin/oidc-providers/{providerId}:
    put:
      operationId: updateOidcProvider
      summary: Change a sign-in provider
      description: Leaving out `clientSecret` keeps the stored one; an empty string removes it.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOidcProviderRequest"
      responses:
        "200":
          description: The saved provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProvider"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      operationId: deleteOidcProvider
      summary: Remove a sign-in provider
      description: |
        Also removes every account's link to it. Accounts that had no other
        way to log in can set a password with password reset.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      responses:
        "204":
          description: The provider is gone.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Log out
      description: Ends the session used for this request.
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/sessions:
    get:
      operationId: listSessions
      summary: List my sessions
      description: Every device where this account is logged in, most recently used first.
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      summary: Revoke a session
      description: Logs out one of my devices.
      tags: [auth]
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The session has ended.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such session for this account (`session_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      summary: My account
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The logged-in account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateCurrentUser
      summary: Change my profile
      description: Only the fields sent are changed.
      tags: [users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/users/me/avatar:
    put:
      operationId: setAvatar
      summary: Upload my profile picture
      description: |
        A PNG, JPEG, WebP or GIF image of at most 8 MB. The server crops the
        square given by `cropX`, `cropY` and `cropSize` (in the image's
        pixels; the centered square if left out), resizes it to 512×512 and
        removes all metadata. Animated GIFs stay animated.
      tags: [users]
      security:
        - bearerAuth: []
      parameters:
        - name: cropX
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: cropY
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: cropSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The account with its new picture.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: The file is over 8 MB or the image over 8192 pixels on a side (`image_too_large`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Not a supported or readable image (`unsupported_image`), or the
            crop square is outside the image (`invalid_crop`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: removeAvatar
      summary: Remove my profile picture
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The account has no picture.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/users/me/status:
    put:
      operationId: setStatus
      summary: Set my status
      description: |
        Sets the chosen status and the custom status text. Leaving out
        `customStatus` removes it. The new presence is sent to the user's
        devices over the gateway.
      tags: [users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetStatusRequest"
      responses:
        "200":
          description: The account with its new status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/users/{userId}:
    get:
      operationId: getUserProfile
      summary: Someone's public profile
      tags: [users]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: There is no such user (`user_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/key-packages:
    get:
      operationId: getKeyPackageStock
      summary: How many key packages this device has stored
      description: |
        The calling device's (session's) stock of MLS key packages. When
        `refill` is true the device should upload more (docs/e2ee-design.md
        §3.2: keep about 50, top up below 20).
      tags: [encryption]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The stock.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyPackageStock"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: uploadKeyPackages
      summary: Store key packages for this device
      description: |
        Adds one-time key packages and optionally replaces the device's
        last-resort package (RFC 9420 §10). Each must be an encoded
        MLSMessage holding a KeyPackage for ciphersuite 0x0001, at most
        16 KiB. The server does not verify signatures; clients do before
        adding anyone. The packages go away when the session ends.
      tags: [encryption]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyPackageUpload"
      responses:
        "200":
          description: Stored; the new stock.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyPackageStock"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The device would hold more than 200 one-time packages (`key_package_stock_full`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            A package is not a key package for ciphersuite 0x0001 or is too
            large (`invalid_key_package`), or the upload is empty or holds
            more than 100 (`validation_failed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/users/{userId}/key-packages/claim:
    post:
      operationId: claimKeyPackages
      summary: Take a key package for each of a user's devices
      description: |
        Hands out one key package per device of the user, to add those
        devices to a group. One-time packages are used up; a device with
        none left gets its last-resort package. Devices without any are
        left out, so an empty list means no device can be added now.
      tags: [encryption]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: One package per device that has one.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClaimedKeyPackage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/identity:
    put:
      operationId: publishIdentity
      summary: Publish this user's identity keys
      description: |
        Stores the public halves of the user master key and self-signing
        key, and the master key's signature over the self-signing key
        (docs/e2ee-design.md §2). The server checks the signature. A new
        self-signing key under the same master key is accepted as is;
        replacing the master key, which every contact sees as an identity
        change, needs a recent login.
      tags: [encryption]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishedIdentity"
      responses:
        "204":
          description: Published.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReauthenticationRequired"
        "422":
          description: |
            A key is not 32 bytes or the signature not 64
            (`invalid_identity`), or the master key did not sign the
            self-signing key (`invalid_signature`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/users/{userId}/identity:
    get:
      operationId: getIdentity
      summary: A user's published identity keys
      description: |
        What a client pins on first contact and checks device certificates
        against. A different master key than the one pinned means the user
        started a new identity, and the client warns before trusting it.
      tags: [encryption]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedIdentity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The user has not published an identity (`identity_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/key-backup:
    get:
      operationId: getKeyBackup
      summary: This user's encrypted key backup
      description: |
        The salt for deriving wrapping keys (created on first use), the
        backup key wrapped under each unlock method the user turned on, and
        the names and sizes of the blobs (docs/e2ee-design.md §5). All of it
        is encrypted on the client; the server cannot open it.
      tags: [encryption]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The backup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyBackup"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/key-backup/wrapped-keys/{method}:
    parameters:
      - name: method
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UnlockMethod"
    put:
      operationId: putWrappedBackupKey
      summary: Turn on or replace an unlock method
      description: |
        Stores the backup key wrapped under this method's key. Needs a
        recent login, because it changes who can open the backup.
      tags: [encryption]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WrappedBackupKeyUpload"
      responses:
        "204":
          description: Stored.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReauthenticationRequired"
        "422":
          description: The wrapped key or its parameters are too large or empty (`invalid_wrapped_key`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteWrappedBackupKey
      summary: Turn off an unlock method
      description: Needs a recent login.
      tags: [encryption]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Turned off.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReauthenticationRequired"
        "404":
          description: This method is not turned on (`backup_item_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/key-backup/blobs/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: Lowercase letters, digits and `_.-`, up to 128, e.g. `identity` or `history.<group>.2026-11`.
        schema:
          type: string
          pattern: "^[a-z0-9][a-z0-9_.-]{0,127}$"
    get:
      operationId: getBackupBlob
      summary: One backup blob
      tags: [encryption]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The blob, sealed with the backup key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupBlob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No blob by that name (`backup_item_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: putBackupBlob
      summary: Store or replace a backup blob
      description: At most 1 MiB each and 10,000 per user.
      tags: [encryption]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupBlob"
      responses:
        "204":
          description: Stored.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The backup already holds 10,000 blobs (`backup_full`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The blob is empty or larger than 1 MiB (`invalid_backup_blob`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteBackupBlob
      summary: Delete a backup blob
      tags: [encryption]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No blob by that name (`backup_item_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/friends:
    get:
      operationId: listFriends
      summary: This user's friends and pending friend requests
      tags: [social]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Friends, requests received and requests sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Friends"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/friends/requests:
    post:
      operationId: sendFriendRequest
      summary: Send a friend request
      description: |
        Sends a request to the user with this username. If they had already
        sent one to you, you become friends instead. Blocks in either
        direction and the recipient's privacy setting both answer
        `friend_request_not_allowed`, so a block is not revealed.
      tags: [social]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendRequestTarget"
      responses:
        "200":
          description: Sent, or accepted their earlier request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipChange"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: This user does not accept friend requests from you (`friend_request_not_allowed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No user has this username (`user_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already friends (`already_friends`) or already requested (`already_requested`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: That is your own username (`cannot_befriend_self`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/friends/requests/{userId}/accept:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: acceptFriendRequest
      summary: Accept a friend request
      tags: [social]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: You are now friends.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: This user sent you no request (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/friends/requests/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteFriendRequest
      summary: Decline a request you received, or cancel one you sent
      tags: [social]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Declined or cancelled.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No request between you and this user (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/friends/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: removeFriend
      summary: Remove a friend
      tags: [social]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: No longer friends.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: You are not friends with this user (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/blocks:
    get:
      operationId: listBlocked
      summary: Users you blocked
      tags: [social]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The blocked users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/blocks/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: blockUser
      summary: Block a user
      description: |
        Ends any friendship and pending request between you, and stops
        friend requests and DMs in both directions. Their messages are
        hidden on your devices. They are not told.
      tags: [social]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Blocked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: There is no such user (`user_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: You cannot block yourself (`cannot_block_self`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: unblockUser
      summary: Unblock a user
      tags: [social]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Unblocked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: You have not blocked this user (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/privacy:
    get:
      operationId: getPrivacySettings
      summary: Who may DM you or send you friend requests
      tags: [social]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacySettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updatePrivacySettings
      summary: Change who may DM you or send you friend requests
      tags: [social]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacySettings"
      responses:
        "204":
          description: Saved.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/conversations:
    get:
      operationId: listConversations
      summary: Your DMs and group DMs, newest first
      tags: [conversations]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The conversations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/conversations/dms:
    post:
      operationId: openDirectMessage
      summary: Open your DM with a user, creating it if needed
      description: |
        A pair of users has one DM. Creating one needs the other user's
        privacy setting to allow you and no block between you; an existing
        DM is returned either way.
      tags: [conversations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectMessageTarget"
      responses:
        "200":
          description: The existing DM.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "201":
          description: A new DM.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: This user does not accept DMs from you (`dm_not_allowed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: There is no such user (`user_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: You cannot DM yourself (`cannot_dm_self`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/conversations/groups:
    post:
      operationId: createGroupConversation
      summary: Start a group DM
      description: 3 to 25 members, counting you; each must accept DMs from you.
      tags: [conversations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewGroupConversation"
      responses:
        "201":
          description: The group DM.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: One of the users does not accept DMs from you (`dm_not_allowed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: One of the users does not exist (`user_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Too few or too many members (`invalid_group_size`), or the name is not 1 to 100 characters (`invalid_name`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/conversations/{conversationId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getConversation
      summary: One of your conversations
      tags: [conversations]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such conversation, or you are not in it (`conversation_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: renameConversation
      summary: Rename a group DM
      tags: [conversations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationRename"
      responses:
        "204":
          description: Renamed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such conversation, or you are not in it (`conversation_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Not a group DM (`not_a_group`), or the name is not 1 to 100 characters (`invalid_name`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/conversations/{conversationId}/members:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: addConversationMember
      summary: Add someone to a group DM
      tags: [conversations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectMessageTarget"
      responses:
        "204":
          description: Added. Their devices join the MLS group with an external commit.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: This user does not accept DMs from you (`dm_not_allowed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such conversation (`conversation_not_found`) or user (`user_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already a member (`already_member`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Not a group DM (`not_a_group`), or it has 25 members (`invalid_group_size`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/conversations/{conversationId}/members/me:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: leaveConversation
      summary: Leave a group DM
      description: |
        Your devices are removed from the MLS group by a membership
        directive the server publishes and the remaining members commit.
      tags: [conversations]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Left.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such conversation, or you are not in it (`conversation_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: A DM cannot be left (`not_a_group`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/conversations/{conversationId}/mls:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getMlsGroupState
      summary: The conversation's MLS group as the delivery service knows it
      description: The current epoch and the latest GroupInfo, which a new device uses to join by external commit.
      tags: [encryption]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The group state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MlsGroupState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such conversation, or you are not in it (`conversation_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/conversations/{conversationId}/mls/commits:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: submitMlsCommit
      summary: Submit a commit for the current epoch
      description: |
        The first valid commit for an epoch wins; later ones get
        `epoch_conflict`, and their devices fetch the winning commit and
        retry. A fresh signed GroupInfo must come with every commit.
      tags: [encryption]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MlsCommit"
      responses:
        "200":
          description: Accepted; the group's new epoch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MlsEpoch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: You cannot send in this conversation (`cannot_send`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such conversation, or you are not in it (`conversation_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Another commit for this epoch came first (`epoch_conflict`), or this one is for another epoch (`wrong_epoch`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Not a commit for this conversation's group, or too large (`invalid_mls_message`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/conversations/{conversationId}/mls/messages:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listMlsMessages
      summary: Live MLS messages after the last one this device saw
      tags: [encryption]
      security:
        - bearerAuth: []
      parameters:
        - name: after
          in: query
          description: The ID of the last message this device has; 0 for the oldest kept.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Commits, application messages, welcomes and membership directives, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MlsMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such conversation, or you are not in it (`conversation_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: sendMlsMessage
      summary: Send an application message for the current epoch
      description: The live copy (an MLS PrivateMessage) and, normally, its archive copy (docs/e2ee-design.md §4).
      tags: [encryption]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MlsSend"
      responses:
        "201":
          description: Stored and delivered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MlsMessageId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: You cannot send in this conversation, for example after a block (`cannot_send`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such conversation, or you are not in it (`conversation_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Not for the current epoch (`wrong_epoch`), or the message ID was already used (`duplicate_message`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Not an application message for this group, or too large (`invalid_mls_message`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/conversations/{conversationId}/icon:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: setConversationIcon
      summary: Set a group DM's icon
      description: |
        Any member may set it. A PNG, JPEG, WebP or GIF image of at most
        8 MB; the server takes the centered square, resizes it to 512×512
        and removes all metadata. Members' devices get conversation_update.
      tags: [conversations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The group DM with its new icon.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such conversation, or you are not in it (`conversation_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The file is over 8 MB or the image over 8192 pixels on a side (`image_too_large`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Not a group DM (`not_a_group`), or not a supported or readable image (`unsupported_image`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: removeConversationIcon
      summary: Remove a group DM's icon
      tags: [conversations]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The group DM without an icon.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such conversation, or you are not in it (`conversation_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Not a group DM (`not_a_group`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/conversation-icons/{iconId}:
    get:
      operationId: getConversationIcon
      summary: A group DM's icon
      description: |
        Public, so it works in an image tag; icon IDs are random and change
        with each upload, so responses can be cached forever.
      tags: [conversations]
      parameters:
        - name: iconId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The 512×512 picture.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        "404":
          description: There is no such icon (`icon_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/conversations/{conversationId}/read:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: markConversationRead
      summary: Mark the conversation read up to a delivered message
      description: >-
        Moves the caller's read position forward (never back, and never past
        the newest message). Every device of the caller gets `read_update`.
      tags: [encryption]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadMark"
      responses:
        "200":
          description: The read position now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such conversation, or you are not in it (`conversation_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/read-state:
    get:
      operationId: listReadStates
      summary: Read position and unread count of each of the caller's conversations
      tags: [encryption]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: One entry per conversation the caller is in.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReadState"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/conversations/{conversationId}/archive:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listArchivedMessages
      summary: Archive copies, newest first, for scrolling back and search
      tags: [encryption]
      security:
        - bearerAuth: []
      parameters:
        - name: before
          in: query
          description: Only copies made before this time; now if missing.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: The archive copies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArchivedMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such conversation, or you are not in it (`conversation_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/avatars/{avatarId}:
    get:
      operationId: getAvatar
      summary: A profile picture
      description: |
        Public, so it works in an image tag. Each upload gets a new ID, so
        responses can be cached forever.
      tags: [users]
      parameters:
        - name: avatarId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The 512×512 picture.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        "404":
          description: There is no such picture (`avatar_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/instance:
    get:
      operationId: getInstanceInfo
      summary: Public instance information
      description: |
        What every client needs before logging in: the instance name, how
        registration works, and whether this connection is secure. Clients
        show the HTTPS warning (spec §3.3) when `secureConnection` is false.
      tags: [instance]
      responses:
        "200":
          description: The instance's public information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceInfo"
  /api/v1/setup:
    get:
      operationId: getSetupStatus
      summary: Setup status
      description: |
        Tells the setup wizard whether the instance still needs setting up,
        and whether this connection is secure (HTTPS or localhost), so it can
        warn that the setup token and password would travel unencrypted.
      tags: [setup]
      responses:
        "200":
          description: Current setup status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
    post:
      operationId: completeSetup
      summary: Complete setup
      description: |
        Creates the first instance admin and saves the basic instance
        settings. Requires the one-time setup token printed in the server
        logs on first boot. Works once; afterwards it returns 409.
      tags: [setup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Setup is complete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The setup token is wrong (`invalid_setup_token`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Setup was already completed (`setup_already_complete`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /healthz:
    get:
      operationId: getLiveness
      summary: Liveness probe
      description: Returns 200 whenever the process is running and serving HTTP.
      tags: [health]
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Returns 200 when every dependency the server needs (currently the
        database) is reachable, and 503 otherwise.
      tags: [health]
      responses:
        "200":
          description: The server is ready to take traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: At least one dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "A session token from `POST /api/v1/auth/login`, sent as `Authorization: Bearer nxs_…`."
  parameters:
    ProviderId:
      name: providerId
      in: path
      required: true
      schema:
        type: string
  responses:
    ProviderNotFound:
      description: There is no sign-in provider with this ID (`provider_not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DomainRequired:
      description: Provider sign-in needs the instance's public domain to be set (`domain_required`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProviderUnavailable:
      description: The provider's OpenID configuration could not be loaded (`provider_unavailable`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    WebAuthnUnavailable:
      description: Passkeys and security keys need the instance's domain to be set and HTTPS (`webauthn_unavailable`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Only instance admins may do this (`forbidden`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ReauthenticationRequired:
      description: |
        This change needs a recent login (`reauthentication_required`): the
        session must have logged in, or confirmed the password with
        `POST /api/v1/auth/reauthenticate`, in the last 10 minutes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: The request has no valid session token (`unauthorized`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The request body is not valid JSON or has the wrong shape (`bad_request`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: One or more fields are invalid (`validation_failed`); `fields` lists them.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many attempts; try again later (`rate_limited`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code, for example `validation_failed`.
        message:
          type: string
          description: Human-readable explanation in English.
        fields:
          type: array
          description: Present for `validation_failed`; one entry per invalid field.
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          description: Path of the field in the request, for example `admin.email`.
        message:
          type: string
    SetupStatus:
      type: object
      additionalProperties: false
      required: [setupRequired, secureConnection, domainFromEnvironment]
      properties:
        setupRequired:
          type: boolean
          description: True until the first admin has been created.
        secureConnection:
          type: boolean
          description: |
            True when this request arrived over HTTPS (directly or via a
            trusted proxy) or is addressed to localhost.
        domain:
          type: string
          description: The configured public domain, if any.
        domainFromEnvironment:
          type: boolean
          description: True when `DOMAIN` is set in `.env`, so the wizard cannot change it.
    SetupRequest:
      type: object
      additionalProperties: false
      required: [setupToken, admin, instance]
      properties:
        setupToken:
          type: string
          description: The token from the server logs. Case and dashes are ignored.
        admin:
          $ref: "#/components/schemas/SetupAdmin"
        instance:
          $ref: "#/components/schemas/SetupInstance"
    SetupAdmin:
      type: object
      additionalProperties: false
      required: [username, displayName, email, password]
      properties:
        username:
          type: string
          description: 3–32 characters from a–z, 0–9, `_` and `.`.
        displayName:
          type: string
          description: 1–32 characters.
        email:
          type: string
        password:
          type: string
          description: At least 10 characters.
    SetupInstance:
      type: object
      additionalProperties: false
      required: [name, registrationMode]
      properties:
        name:
          type: string
          description: Instance name shown to users, 1–64 characters.
        domain:
          type: string
          description: Public domain such as `chat.example.com`. Ignored when `DOMAIN` is set in `.env`.
        registrationMode:
          $ref: "#/components/schemas/RegistrationMode"
    RegistrationMode:
      type: string
      enum: [open, invite_only, closed]
      description: Who may create accounts.
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, displayName, email, password, deviceName]
      properties:
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
        password:
          type: string
        inviteCode:
          type: string
          description: Required when registration is invite-only.
        deviceName:
          type: string
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
    CompletePasswordResetRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
    CreateInviteRequest:
      type: object
      additionalProperties: false
      properties:
        maxUses:
          type: integer
          format: int32
          minimum: 1
          description: How many accounts may use the invite. Omit for no limit.
        expiresAt:
          type: string
          format: date-time
          description: When the invite stops working. Omit for never.
    Invite:
      type: object
      additionalProperties: false
      required: [id, uses, createdAt]
      properties:
        id:
          type: string
          format: uuid
        maxUses:
          type: integer
          format: int32
        uses:
          type: integer
          format: int32
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    CreatedInvite:
      type: object
      additionalProperties: false
      required: [id, code]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: The invite code. Shown only this once.
    MfaChallenge:
      type: object
      additionalProperties: false
      required: [challengeToken, methods]
      properties:
        challengeToken:
          type: string
        methods:
          type: array
          items:
            $ref: "#/components/schemas/MfaMethod"
    MfaMethod:
      type: string
      enum: [totp, security_key, backup_code]
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required: [challengeToken, method, code, deviceName]
      properties:
        challengeToken:
          type: string
        method:
          $ref: "#/components/schemas/MfaMethod"
        code:
          type: string
        deviceName:
          type: string
    SecondFactors:
      type: object
      additionalProperties: false
      required: [authenticators, backupCodesRemaining]
      properties:
        authenticators:
          type: array
          items:
            $ref: "#/components/schemas/Authenticator"
        backupCodesRemaining:
          type: integer
          format: int64
    Authenticator:
      type: object
      additionalProperties: false
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    EnrollTotpRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          description: A label such as "Phone", 1–64 characters.
    TotpEnrollment:
      type: object
      additionalProperties: false
      required: [enrollmentId, secret, otpauthUrl]
      properties:
        enrollmentId:
          type: string
          format: uuid
        secret:
          type: string
          description: Base32 secret, for typing into an app by hand.
        otpauthUrl:
          type: string
          description: Show this as a QR code.
    CodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
    TotpConfirmation:
      type: object
      additionalProperties: false
      properties:
        backupCodes:
          type: array
          items:
            type: string
          description: Present only when this is the first second factor.
    BackupCodes:
      type: object
      additionalProperties: false
      required: [codes]
      properties:
        codes:
          type: array
          items:
            type: string
    ChallengeRequest:
      type: object
      additionalProperties: false
      required: [challengeToken]
      properties:
        challengeToken:
          type: string
    WebAuthnCeremony:
      type: object
      additionalProperties: false
      required: [ceremonyId, options]
      properties:
        ceremonyId:
          type: string
          format: uuid
        options:
          type: object
          additionalProperties: true
          description: WebAuthn options, as defined by the W3C WebAuthn specification.
    WebAuthnLoginAnswer:
      type: object
      additionalProperties: false
      required: [ceremonyId, credential, deviceName]
      properties:
        ceremonyId:
          type: string
          format: uuid
        credential:
          type: object
          additionalProperties: true
          description: The PublicKeyCredential from the browser, serialized as JSON.
        deviceName:
          type: string
    WebAuthnRegistrationRequest:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind:
          $ref: "#/components/schemas/WebAuthnKind"
        name:
          type: string
    WebAuthnRegistrationAnswer:
      type: object
      additionalProperties: false
      required: [ceremonyId, kind, credential]
      properties:
        ceremonyId:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/WebAuthnKind"
        credential:
          type: object
          additionalProperties: true
    WebAuthnKind:
      type: string
      enum: [passkey, security_key]
      description: A passkey replaces the password; a security key is a second factor after it.
    WebAuthnCredential:
      type: object
      additionalProperties: false
      required: [id, kind, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/WebAuthnKind"
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
    PublishedIdentity:
      type: object
      description: A user's identity keys, Ed25519, base64.
      required: [masterPublicKey, selfSigningPublicKey, selfSigningSignature]
      properties:
        masterPublicKey:
          type: string
          format: byte
          description: The user master key's public half (32 bytes).
        selfSigningPublicKey:
          type: string
          format: byte
          description: The self-signing key's public half (32 bytes).
        selfSigningSignature:
          type: string
          format: byte
          description: |
            The master key's signature (64 bytes) over the statement
            `nexus-chat self-signing key v1` and the self-signing key, each
            preceded by its length as 4 bytes, big-endian.
    UnlockMethod:
      type: string
      enum: [recovery-phrase, password, passkey]
      description: How a wrapped copy of the backup key is unlocked (docs/e2ee-design.md §5).
    WrappedBackupKey:
      type: object
      required: [method, wrappedKey]
      properties:
        method:
          $ref: "#/components/schemas/UnlockMethod"
        wrappedKey:
          type: string
          format: byte
          description: The backup key sealed under this method's key (at most 256 bytes).
        parameters:
          type: string
          format: byte
          description: What the client needs to derive the key again, e.g. Argon2id settings (at most 1 KiB).
    WrappedBackupKeyUpload:
      type: object
      required: [wrappedKey]
      properties:
        wrappedKey:
          type: string
          format: byte
        parameters:
          type: string
          format: byte
    BackupBlobInfo:
      type: object
      required: [name, size, updatedAt]
      properties:
        name:
          type: string
        size:
          type: integer
          format: int32
          description: Bytes.
        updatedAt:
          type: string
          format: date-time
    KeyBackup:
      type: object
      required: [salt, wrappedKeys, blobs]
      properties:
        salt:
          type: string
          format: byte
          description: 16 random bytes, the salt for the recovery-phrase and passkey wrapping keys.
        wrappedKeys:
          type: array
          items:
            $ref: "#/components/schemas/WrappedBackupKey"
        blobs:
          type: array
          items:
            $ref: "#/components/schemas/BackupBlobInfo"
    BackupBlob:
      type: object
      required: [data]
      properties:
        data:
          type: string
          format: byte
          description: Sealed with the backup key, at most 1 MiB.
    UserSummary:
      type: object
      description: Enough to show another user in a list.
      required: [id, username, displayName]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
          description: Path of the profile picture; missing without one.
    Contact:
      type: object
      required: [user, since]
      properties:
        user:
          $ref: "#/components/schemas/UserSummary"
        since:
          type: string
          format: date-time
          description: When the friendship, request or block began.
    Friends:
      type: object
      required: [friends, incoming, outgoing]
      properties:
        friends:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
        incoming:
          type: array
          description: Requests other users sent you.
          items:
            $ref: "#/components/schemas/Contact"
        outgoing:
          type: array
          description: Requests you sent.
          items:
            $ref: "#/components/schemas/Contact"
    FriendRequestTarget:
      type: object
      required: [username]
      properties:
        username:
          type: string
    Relationship:
      type: string
      description: |
        How you stand towards another user. `blocked` means you blocked
        them; a user you are blocked by shows as `none`.
      enum: [none, friend, incoming, outgoing, blocked]
    RelationshipChange:
      type: object
      required: [userId, relationship]
      properties:
        userId:
          type: string
          format: uuid
        relationship:
          $ref: "#/components/schemas/Relationship"
    PrivacySettings:
      type: object
      required: [whoCanDirectMessage, whoCanFriendRequest]
      properties:
        whoCanDirectMessage:
          type: string
          enum: [everyone, friends, friends_and_server_members]
          description: Default `friends_and_server_members`.
        whoCanFriendRequest:
          type: string
          enum: [everyone, server_members, nobody]
          description: Default `everyone`.
    Conversation:
      type: object
      required: [id, kind, mlsGroupId, createdAt, members]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [dm, group]
        name:
          type: string
          description: Group DMs only, when named.
        iconUrl:
          type: string
          description: Group DMs only, when they have an icon; the path of the 512×512 picture.
        mlsGroupId:
          type: string
          format: byte
          description: The MLS group that encrypts this conversation (16 bytes).
        createdAt:
          type: string
          format: date-time
        members:
          type: array
          items:
            $ref: "#/components/schemas/UserSummary"
    DirectMessageTarget:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
    NewGroupConversation:
      type: object
      required: [memberIds]
      properties:
        name:
          type: string
        memberIds:
          type: array
          description: The other members; you are added too.
          items:
            type: string
            format: uuid
    ConversationRename:
      type: object
      properties:
        name:
          type: string
          nullable: true
          description: The new name; null or missing removes it.
    MlsGroupState:
      type: object
      required: [groupId, epoch]
      properties:
        groupId:
          type: string
          format: byte
        epoch:
          type: integer
          format: int64
        groupInfo:
          type: string
          format: byte
          description: The latest signed GroupInfo (an MLSMessage); missing before the first commit.
    MlsCommit:
      type: object
      required: [commit, groupInfo]
      properties:
        commit:
          type: string
          format: byte
          description: An MLSMessage holding the commit.
        groupInfo:
          type: string
          format: byte
          description: The GroupInfo for the new epoch (an MLSMessage).
        welcome:
          type: string
          format: byte
          description: The Welcome for added devices, if any (an MLSMessage).
    MlsEpoch:
      type: object
      required: [epoch]
      properties:
        epoch:
          type: integer
          format: int64
    MlsSend:
      type: object
      required: [message]
      properties:
        message:
          type: string
          format: byte
          description: An MLSMessage holding a PrivateMessage with application content.
        archive:
          $ref: "#/components/schemas/ArchiveCopy"
    ArchiveCopy:
      type: object
      required: [messageId, sealed]
      properties:
        messageId:
          type: string
          format: uuid
          description: Chosen by the sender; edits, reactions and replies refer to it.
        sealed:
          type: string
          format: byte
    MlsMessageId:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
    ReadMark:
      type: object
      additionalProperties: false
      required: [lastReadId]
      properties:
        lastReadId:
          description: The ID of the last live MLS message the user has seen; negative IDs get 422.
          type: integer
          format: int64
    ReadState:
      type: object
      required: [conversationId, lastReadId, unreadCount]
      properties:
        conversationId:
          type: string
          format: uuid
        lastReadId:
          type: integer
          format: int64
          minimum: 0
        unreadCount:
          description: Application messages from others after `lastReadId`, counted up to 1000.
          type: integer
          format: int64
          minimum: 0
          maximum: 1000
    MlsMessage:
      type: object
      required: [id, kind, epoch, data, createdAt]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [commit, application, welcome, directive]
        epoch:
          type: integer
          format: int64
        senderId:
          type: string
          format: uuid
          description: Missing for directives, which the instance issues.
        data:
          type: string
          format: byte
          description: |
            An MLSMessage, or for a directive the JSON
            `{"directive": base64, "signature": base64}`, signed with the
            instance key over "nexus-chat membership directive v1\n" and the
            directive bytes.
        createdAt:
          type: string
          format: date-time
    ArchivedMessage:
      type: object
      required: [messageId, epoch, sealed, createdAt]
      properties:
        messageId:
          type: string
          format: uuid
        epoch:
          type: integer
          format: int64
        senderId:
          type: string
          format: uuid
        sealed:
          type: string
          format: byte
        createdAt:
          type: string
          format: date-time
    KeyPackageStock:
      type: object
      additionalProperties: false
      required: [oneTime, hasLastResort, refill]
      properties:
        oneTime:
          type: integer
          format: int32
          description: One-time key packages stored for this device.
        hasLastResort:
          type: boolean
        refill:
          type: boolean
          description: True when fewer than 20 one-time packages are left.
    KeyPackageUpload:
      type: object
      additionalProperties: false
      required: [keyPackages]
      properties:
        keyPackages:
          type: array
          maxItems: 100
          items:
            type: string
            format: byte
          description: Encoded MLSMessages, each holding a KeyPackage (base64).
        lastResort:
          type: string
          format: byte
          description: Replaces the device's last-resort key package.
    ClaimedKeyPackage:
      type: object
      additionalProperties: false
      required: [deviceId, keyPackage, lastResort]
      properties:
        deviceId:
          type: string
          format: uuid
        keyPackage:
          type: string
          format: byte
        lastResort:
          type: boolean
    ReauthenticateRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, password, deviceName]
      properties:
        login:
          type: string
          description: Username or email address.
        password:
          type: string
        deviceName:
          type: string
          description: Shown in the session list, for example "Firefox on Linux". 1–64 characters.
    LoginResult:
      type: object
      additionalProperties: false
      required: [token, session, user]
      properties:
        token:
          type: string
          description: "Session token. Send it as `Authorization: Bearer <token>`. It is shown only once."
        session:
          $ref: "#/components/schemas/Session"
        user:
          $ref: "#/components/schemas/CurrentUser"
    Session:
      type: object
      additionalProperties: false
      required: [id, deviceName, createdAt, lastSeenAt, expiresAt, current]
      properties:
        id:
          type: string
          format: uuid
        deviceName:
          type: string
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: True for the session making this request.
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, username, displayName, email, emailVerified, isInstanceAdmin, bio, status]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
        isInstanceAdmin:
          type: boolean
        bio:
          type: string
        avatarUrl:
          type: string
          description: Path of the profile picture; missing without one.
        status:
          $ref: "#/components/schemas/UserStatus"
        customStatus:
          $ref: "#/components/schemas/CustomStatus"
    SetupResult:
      type: object
      additionalProperties: false
      required: [adminUserId]
      properties:
        adminUserId:
          type: string
          format: uuid
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          $ref: "#/components/schemas/HealthState"
        checks:
          type: array
          description: One entry per dependency. Empty for the liveness probe.
          items:
            $ref: "#/components/schemas/HealthCheck"
    HealthCheck:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          description: Dependency name, for example `database`.
          example: database
        status:
          $ref: "#/components/schemas/HealthState"
    HealthState:
      type: string
      enum: [ok, unavailable]
    InstanceInfo:
      type: object
      additionalProperties: false
      required: [name, registrationMode, secureConnection, signingKey, limits]
      properties:
        limits:
          $ref: "#/components/schemas/InstanceLimits"
        signingKey:
          type: string
          format: byte
          description: |
            The instance's Ed25519 public key (32 bytes). Devices check
            membership directives against it (docs/e2ee-design.md §3.2).
        name:
          type: string
        domain:
          type: string
          description: The public domain, once one is set.
        registrationMode:
          $ref: "#/components/schemas/RegistrationMode"
        secureConnection:
          type: boolean
          description: |
            True when this request arrived over HTTPS (directly or via a
            trusted proxy) or is addressed to localhost.
    InstanceLimits:
      type: object
      additionalProperties: false
      required: [groupDmMaxMembers]
      properties:
        groupDmMaxMembers:
          type: integer
          minimum: 3
          maximum: 100
          description: The largest group DM, counting its creator (GROUP_DM_MAX_MEMBERS).
    TlsStatus:
      type: object
      additionalProperties: false
      required: [active]
      properties:
        active:
          type: boolean
          description: True while the server serves HTTPS with its own certificate.
        names:
          type: array
          description: The domain names the certificate covers.
          items:
            type: string
        issuer:
          type: string
        expiresAt:
          type: string
          format: date-time
    InstallTlsCertificateRequest:
      type: object
      additionalProperties: false
      required: [certificate, privateKey]
      properties:
        certificate:
          type: string
          description: PEM certificate chain, leaf first, including intermediates.
        privateKey:
          type: string
          description: PEM private key of the leaf certificate.
    SmtpSecurity:
      type: string
      description: |
        `starttls` (usually port 587) and `tls` (usually port 465) encrypt
        the connection; `none` is only for a relay on the same network.
      enum: [starttls, tls, none]
    SmtpSettings:
      type: object
      additionalProperties: false
      required: [configured, host, port, security, username, from, passwordSet]
      properties:
        configured:
          type: boolean
          description: True once a mail server is set, so the server can send email.
        host:
          type: string
        port:
          type: integer
          format: int32
        security:
          $ref: "#/components/schemas/SmtpSecurity"
        username:
          type: string
        from:
          type: string
        passwordSet:
          type: boolean
    UpdateSmtpSettingsRequest:
      type: object
      additionalProperties: false
      required: [host, port, security, from]
      properties:
        host:
          type: string
        port:
          type: integer
          format: int32
        security:
          $ref: "#/components/schemas/SmtpSecurity"
        username:
          type: string
        password:
          type: string
          description: Leave out to keep the stored password; empty to remove it.
        from:
          type: string
          description: The sender address, for example `chat@example.com`.
    SignInProvider:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          type: string
        displayName:
          type: string
    BeginProviderSignInRequest:
      type: object
      additionalProperties: false
      required: [returnTo]
      properties:
        returnTo:
          type: string
          description: |
            Where the browser goes afterwards: a path on this instance (web
            and desktop, for example `/login/oidc`) or a `nexuschat://`
            address (mobile apps).
        inviteCode:
          type: string
          description: Used if the sign-in creates an account on an invite-only instance.
    BeginProviderLinkRequest:
      type: object
      additionalProperties: false
      required: [returnTo]
      properties:
        returnTo:
          type: string
          description: As for `begin`.
    ProviderFlow:
      type: object
      additionalProperties: false
      required: [flowId, authorizationUrl]
      properties:
        flowId:
          type: string
          format: uuid
          description: Keep this in memory; completing needs it.
        authorizationUrl:
          type: string
    CompleteProviderSignInRequest:
      type: object
      additionalProperties: false
      required: [flowId, code, deviceName]
      properties:
        flowId:
          type: string
          format: uuid
        code:
          type: string
          description: The `code` from the return address's fragment.
        deviceName:
          type: string
          description: Shown in the session list. 1–64 characters.
    CompleteProviderLinkRequest:
      type: object
      additionalProperties: false
      required: [flowId, code]
      properties:
        flowId:
          type: string
          format: uuid
        code:
          type: string
    LinkedProvider:
      type: object
      additionalProperties: false
      required: [providerId, displayName, email, linkedAt]
      properties:
        providerId:
          type: string
        displayName:
          type: string
        email:
          type: string
          description: The email the provider shared when it was linked (may be empty).
        linkedAt:
          type: string
          format: date-time
    OidcProviderList:
      type: object
      additionalProperties: false
      required: [providers]
      properties:
        callbackUrl:
          type: string
          description: The redirect URI to register at each provider; missing until a domain is set.
        providers:
          type: array
          items:
            $ref: "#/components/schemas/OidcProvider"
    OidcProvider:
      type: object
      additionalProperties: false
      required: [id, displayName, issuer, clientId, clientSecretSet, scopes, allowSignup]
      properties:
        id:
          type: string
        displayName:
          type: string
        issuer:
          type: string
        clientId:
          type: string
        clientSecretSet:
          type: boolean
        scopes:
          type: array
          items:
            type: string
        allowSignup:
          type: boolean
          description: Whether a first sign-in creates an account (following the registration mode).
    CreateOidcProviderRequest:
      type: object
      additionalProperties: false
      required: [id, displayName, issuer, clientId, allowSignup]
      properties:
        id:
          type: string
          description: 2–32 lower-case letters, digits or dashes; used in URLs and cannot change.
        displayName:
          type: string
          description: Shown on the login button, for example "Company login". 1–64 characters.
        issuer:
          type: string
          description: The issuer URL, for example `https://login.example.com/realms/staff`.
        clientId:
          type: string
        clientSecret:
          type: string
          description: Leave out for a public client.
        scopes:
          type: array
          description: Defaults to `openid email profile`; `openid` is always added.
          items:
            type: string
        allowSignup:
          type: boolean
    UpdateOidcProviderRequest:
      type: object
      additionalProperties: false
      required: [displayName, issuer, clientId, allowSignup]
      properties:
        displayName:
          type: string
        issuer:
          type: string
        clientId:
          type: string
        clientSecret:
          type: string
          description: Leave out to keep the stored secret; empty to remove it.
        scopes:
          type: array
          items:
            type: string
        allowSignup:
          type: boolean
    UserStatus:
      type: string
      description: The status the user chose.
      enum: [online, idle, dnd, invisible]
    CustomStatus:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          description: 1–128 characters.
        expiresAt:
          type: string
          format: date-time
          description: When it is removed automatically; never if missing.
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          description: 1–32 characters.
        bio:
          type: string
          description: At most 500 characters; empty removes it.
    SetStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/UserStatus"
        customStatus:
          $ref: "#/components/schemas/CustomStatus"
    UserProfile:
      type: object
      additionalProperties: false
      required: [id, username, displayName, bio, status]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        bio:
          type: string
        avatarUrl:
          type: string
          description: Path of the profile picture, for example `/api/v1/avatars/{id}`; missing without one.
        status:
          $ref: "#/components/schemas/PresenceStatus"
        customStatus:
          $ref: "#/components/schemas/CustomStatus"
    PresenceStatus:
      type: string
      description: What others see. A user who chose invisible, or has no device connected, is offline.
      enum: [online, idle, dnd, offline]
