openapi: 3.0.3
info:
  title: Nexus Chat Server API
  version: 0.1.0
  description: |
    The HTTP API of a Nexus Chat instance. This file is the contract: Go
    server interfaces and the TypeScript client are generated from it.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /
tags:
  - name: health
    description: Liveness and readiness probes used by Docker and orchestrators.
  - name: setup
    description: First-run setup of a fresh instance (spec §3.5).
  - name: auth
    description: Logging in and out, and managing sessions (spec §4.1).
  - name: users
    description: User accounts and profiles.
  - name: instance
    description: Public information about this instance.
  - name: admin
    description: Instance administration. Every operation needs an instance admin.
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Log in with a password
      description: |
        Checks the username (or email) and password and starts a session.
        After repeated wrong passwords the account is locked for a short,
        growing time; the response then has code `login_delayed` and a
        `Retry-After` header.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "202":
          description: |
            The password is right, but the account has a second factor. Send
            the challenge with a code to `POST /api/v1/auth/login/mfa` within
            five minutes. The challenge allows one attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaChallenge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The username or password is wrong (`invalid_credentials`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many attempts from this address (`rate_limited`) or for this account (`login_delayed`).
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/register:
    post:
      operationId: register
      summary: Create an account
      description: |
        Creates an account and logs it in. Whether this is allowed depends on
        the instance's registration mode: `open`, `invite_only` (needs
        `inviteCode`) or `closed`. A verification email is sent if the
        instance has email set up.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: The account exists and is logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Registration is not allowed (`registration_closed`, `invite_required` or `invalid_invite`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Confirm an email address
      description: Redeems the token from a verification email link.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "204":
          description: The address is verified.
        "400":
          description: The token is invalid or expired (`invalid_token`), or the body is malformed (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      summary: Send the verification email again
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "202":
          description: A new link is on its way. Older links stop working.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The address is already verified (`already_verified`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The instance cannot send email (`email_unavailable`); the message says why.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/password-reset:
    post:
      operationId: requestPasswordReset
      summary: Ask for a password reset link
      description: |
        Emails a reset link if the address has an account. The response is
        the same either way, so it does not reveal who is registered.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: If the address has an account, a link is on its way.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/password-reset/complete:
    post:
      operationId: completePasswordReset
      summary: Choose a new password
      description: |
        Sets a new password using the token from the reset link, and logs
        out every session of the account. This restores login only; it does
        not restore encryption keys.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletePasswordResetRequest"
      responses:
        "204":
          description: The password is changed. Log in again.
        "400":
          description: The token is invalid or expired (`invalid_token`), or the body is malformed (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/admin/invites:
    get:
      operationId: listInvites
      summary: List instance invites
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every invite, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createInvite
      summary: Create an instance invite
      description: The code is returned once and cannot be shown again.
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: The new invite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/admin/invites/{inviteId}:
    delete:
      operationId: deleteInvite
      summary: Revoke an instance invite
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The invite no longer works.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such invite (`invite_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/admin/tls:
    get:
      operationId: getTlsStatus
      summary: HTTPS certificate status
      description: |
        Whether the server serves HTTPS with an uploaded or mounted
        certificate, and which names it covers until when. An instance
        behind a reverse proxy shows `active: false` here.
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The certificate in use, if any.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TlsStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: installTlsCertificate
      summary: Upload an HTTPS certificate
      description: |
        Validates the certificate chain and private key (the key matches,
        the chain is complete and trusted, the certificate covers the
        instance domain and is currently valid), saves them and starts
        serving HTTPS without a restart. A rejected upload changes nothing.
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallTlsCertificateRequest"
      responses:
        "200":
          description: The certificate is now served.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TlsStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: |
            The certificate cannot be used (`certificate_rejected`); the
            message says why, for example a missing intermediate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: removeTlsCertificate
      summary: Remove the HTTPS certificate
      description: Deletes the certificate files and stops serving HTTPS. Plain HTTP keeps working.
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: HTTPS is off.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/smtp:
    get:
      operationId: getSmtpSettings
      summary: Mail server settings
      description: The password is never returned; `passwordSet` says whether one is stored.
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The current settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmtpSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateSmtpSettings
      summary: Change the mail server settings
      description: |
        Replaces the settings. Leaving out `password` keeps the stored one;
        an empty string removes it. The next email uses the new settings.
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSmtpSettingsRequest"
      responses:
        "200":
          description: The saved settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmtpSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/admin/smtp/test:
    post:
      operationId: sendTestEmail
      summary: Send a test email
      description: Sends a test email to the calling admin's own address with the saved settings.
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The mail server accepted the message.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: SMTP is not configured yet (`smtp_not_configured`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: |
            The mail server refused or could not be reached
            (`mail_delivery_failed`); the message has the server's reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/login/mfa:
    post:
      operationId: completeLoginMfa
      summary: Finish logging in with a second factor
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaLoginRequest"
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The code is wrong or the challenge expired (`invalid_second_factor`). Log in with the password again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/mfa:
    get:
      operationId: getSecondFactors
      summary: My second factors
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The account's authenticator apps and remaining backup codes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecondFactors"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/mfa/totp:
    post:
      operationId: enrollTotp
      summary: Start adding an authenticator app
      description: Returns a secret and an `otpauth://` URL to show as a QR code. Confirm with a code to finish.
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollTotpRequest"
      responses:
        "201":
          description: The pending authenticator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpEnrollment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/mfa/totp/{enrollmentId}/confirm:
    post:
      operationId: confirmTotp
      summary: Finish adding an authenticator app
      description: |
        Activates the authenticator. When it is the account's first second
        factor, the response includes ten backup codes, shown only this once.
      tags: [auth]
      security:
        - bearerAuth: []
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRequest"
      responses:
        "200":
          description: The authenticator is active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpConfirmation"
        "400":
          description: Wrong code (`invalid_code`), unknown setup (`enrollment_not_found`), or malformed body (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/mfa/totp/{authenticatorId}:
    delete:
      operationId: removeTotp
      summary: Remove an authenticator app
      tags: [auth]
      security:
        - bearerAuth: []
      parameters:
        - name: authenticatorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such authenticator (`authenticator_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/mfa/backup-codes:
    post:
      operationId: regenerateBackupCodes
      summary: Replace my backup codes
      description: Creates ten new backup codes. The old ones stop working.
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The new codes, shown only this once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupCodes"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/login/mfa/security-key/begin:
    post:
      operationId: beginSecurityKeyLogin
      summary: Start the security-key step of a login
      description: |
        Uses up the MFA challenge and returns WebAuthn options for
        `navigator.credentials.get()`. Finish with the ceremony ID.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeRequest"
      responses:
        "200":
          description: Pass `options` to the browser.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnCeremony"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The challenge is unknown or expired (`invalid_second_factor`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/WebAuthnUnavailable"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/login/mfa/security-key/finish:
    post:
      operationId: finishSecurityKeyLogin
      summary: Finish logging in with a security key
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnLoginAnswer"
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The key could not be verified or the request expired (`invalid_second_factor`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/passkey/begin:
    post:
      operationId: beginPasskeyLogin
      summary: Start logging in with a passkey
      description: No username or password is needed; the browser offers the passkeys it holds.
      tags: [auth]
      responses:
        "200":
          description: Pass `options` to `navigator.credentials.get()`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnCeremony"
        "409":
          $ref: "#/components/responses/WebAuthnUnavailable"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/passkey/finish:
    post:
      operationId: finishPasskeyLogin
      summary: Finish logging in with a passkey
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnLoginAnswer"
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The passkey could not be verified or the request expired (`invalid_passkey`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/webauthn:
    get:
      operationId: listWebAuthnCredentials
      summary: My security keys and passkeys
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every registered credential, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebAuthnCredential"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/webauthn/register/begin:
    post:
      operationId: beginWebAuthnRegistration
      summary: Start adding a security key or passkey
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnRegistrationRequest"
      responses:
        "200":
          description: Pass `options` to `navigator.credentials.create()`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnCeremony"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/WebAuthnUnavailable"
  /api/v1/auth/webauthn/register/finish:
    post:
      operationId: finishWebAuthnRegistration
      summary: Finish adding a security key or passkey
      description: |
        When this is the account's first second factor, the response
        includes ten backup codes, shown only this once.
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnRegistrationAnswer"
      responses:
        "201":
          description: The credential is registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpConfirmation"
        "400":
          description: The credential could not be verified (`invalid_credential`) or the request expired (`ceremony_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/webauthn/{credentialId}:
    delete:
      operationId: removeWebAuthnCredential
      summary: Remove a security key or passkey
      tags: [auth]
      security:
        - bearerAuth: []
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such credential (`credential_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/oidc/providers:
    get:
      operationId: listSignInProviders
      summary: Sign-in providers
      description: The providers the login page offers, sorted by name.
      tags: [auth]
      responses:
        "200":
          description: Every configured provider.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SignInProvider"
  /api/v1/auth/oidc/providers/{providerId}/begin:
    post:
      operationId: beginProviderSignIn
      summary: Start signing in with a provider
      description: |
        Returns the provider's sign-in address to open in a browser and a
        `flowId` the client keeps. The provider sends the browser back to
        `returnTo` with `#flow=...&code=...` (or `#error=...`); finish with
        `POST /api/v1/auth/oidc/complete` within ten minutes.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeginProviderSignInRequest"
      responses:
        "200":
          description: Open `authorizationUrl`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderFlow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "409":
          $ref: "#/components/responses/DomainRequired"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/ProviderUnavailable"
  /api/v1/auth/oidc/callback:
    get:
      operationId: providerCallback
      summary: Provider callback
      description: |
        Where providers send the browser after sign-in. Register the
        instance's base URL followed by this path at the provider. Always
        redirects to the address the client gave when it began, except
        for an unknown or used `state`.
      tags: [auth]
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Back to the client, with the result in the URL fragment.
          headers:
            Location:
              required: true
              schema:
                type: string
        "400":
          description: The sign-in link is unknown, used or expired (`invalid_state`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/oidc/complete:
    post:
      operationId: completeProviderSignIn
      summary: Finish signing in with a provider
      description: |
        Logs in the account linked to the provider login. If there is none
        and the provider allows sign-up, creates one first, following the
        registration mode. Accounts with a second factor get an MFA
        challenge, exactly as with `POST /api/v1/auth/login`.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteProviderSignInRequest"
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "202":
          description: The account has a second factor; continue with `POST /api/v1/auth/login/mfa`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaChallenge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The flow and code do not match a finished provider sign-in (`invalid_flow`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            No account can be used or created: `no_account` (sign-up is off
            for this provider), `registration_closed`, `invite_required`,
            `invalid_invite`, or `email_required` (the provider shared no
            email address).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            An account already uses this email (`email_in_use`): log in to
            it another way and link the provider in settings. Or the same
            provider login signed up twice at once (`identity_in_use`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/oidc/providers/{providerId}/link:
    post:
      operationId: beginProviderLink
      summary: Start linking a provider to my account
      description: Like `begin`, for the logged-in account. Finish with `POST /api/v1/auth/oidc/link/complete`.
      tags: [auth]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeginProviderLinkRequest"
      responses:
        "200":
          description: Open `authorizationUrl`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderFlow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "409":
          $ref: "#/components/responses/DomainRequired"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/ProviderUnavailable"
  /api/v1/auth/oidc/link/complete:
    post:
      operationId: completeProviderLink
      summary: Finish linking a provider to my account
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteProviderLinkRequest"
      responses:
        "204":
          description: The provider login now signs in to this account.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: No valid session (`unauthorized`), or the flow and code do not match a link this account started (`invalid_flow`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            The provider login belongs to another account
            (`identity_in_use`), or this account is linked to a different
            login at the provider (`already_linked`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/oidc/identities:
    get:
      operationId: listLinkedProviders
      summary: Providers linked to my account
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The linked providers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LinkedProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/oidc/identities/{providerId}:
    delete:
      operationId: unlinkProvider
      summary: Unlink a provider from my account
      tags: [auth]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      responses:
        "204":
          description: The provider no longer signs in to this account.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: This account is not linked to that provider (`not_linked`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: It is the account's only way to log in (`last_login_method`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/admin/oidc-providers:
    get:
      operationId: listOidcProviders
      summary: List sign-in providers
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every provider, with the callback URL to register at each.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProviderList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createOidcProvider
      summary: Add a sign-in provider
      description: |
        The issuer's OpenID configuration is fetched before saving, so a
        mistyped issuer is reported as a validation error on `issuer`.
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOidcProviderRequest"
      responses:
        "201":
          description: The saved provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProvider"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A provider with this ID exists (`provider_exists`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/admin/oidc-providers/{providerId}:
    put:
      operationId: updateOidcProvider
      summary: Change a sign-in provider
      description: Leaving out `clientSecret` keeps the stored one; an empty string removes it.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOidcProviderRequest"
      responses:
        "200":
          description: The saved provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProvider"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      operationId: deleteOidcProvider
      summary: Remove a sign-in provider
      description: |
        Also removes every account's link to it. Accounts that had no other
        way to log in can set a password with password reset.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      responses:
        "204":
          description: The provider is gone.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Log out
      description: Ends the session used for this request.
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/sessions:
    get:
      operationId: listSessions
      summary: List my sessions
      description: Every device where this account is logged in, most recently used first.
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      summary: Revoke a session
      description: Logs out one of my devices.
      tags: [auth]
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The session has ended.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such session for this account (`session_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      summary: My account
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The logged-in account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/instance:
    get:
      operationId: getInstanceInfo
      summary: Public instance information
      description: |
        What every client needs before logging in: the instance name, how
        registration works, and whether this connection is secure. Clients
        show the HTTPS warning (spec §3.3) when `secureConnection` is false.
      tags: [instance]
      responses:
        "200":
          description: The instance's public information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceInfo"
  /api/v1/setup:
    get:
      operationId: getSetupStatus
      summary: Setup status
      description: |
        Tells the setup wizard whether the instance still needs setting up,
        and whether this connection is secure (HTTPS or localhost), so it can
        warn that the setup token and password would travel unencrypted.
      tags: [setup]
      responses:
        "200":
          description: Current setup status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
    post:
      operationId: completeSetup
      summary: Complete setup
      description: |
        Creates the first instance admin and saves the basic instance
        settings. Requires the one-time setup token printed in the server
        logs on first boot. Works once; afterwards it returns 409.
      tags: [setup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Setup is complete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The setup token is wrong (`invalid_setup_token`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Setup was already completed (`setup_already_complete`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /healthz:
    get:
      operationId: getLiveness
      summary: Liveness probe
      description: Returns 200 whenever the process is running and serving HTTP.
      tags: [health]
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Returns 200 when every dependency the server needs (currently the
        database) is reachable, and 503 otherwise.
      tags: [health]
      responses:
        "200":
          description: The server is ready to take traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: At least one dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "A session token from `POST /api/v1/auth/login`, sent as `Authorization: Bearer nxs_…`."
  parameters:
    ProviderId:
      name: providerId
      in: path
      required: true
      schema:
        type: string
  responses:
    ProviderNotFound:
      description: There is no sign-in provider with this ID (`provider_not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DomainRequired:
      description: Provider sign-in needs the instance's public domain to be set (`domain_required`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProviderUnavailable:
      description: The provider's OpenID configuration could not be loaded (`provider_unavailable`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    WebAuthnUnavailable:
      description: Passkeys and security keys need the instance's domain to be set and HTTPS (`webauthn_unavailable`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Only instance admins may do this (`forbidden`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: The request has no valid session token (`unauthorized`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The request body is not valid JSON or has the wrong shape (`bad_request`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: One or more fields are invalid (`validation_failed`); `fields` lists them.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many attempts; try again later (`rate_limited`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code, for example `validation_failed`.
        message:
          type: string
          description: Human-readable explanation in English.
        fields:
          type: array
          description: Present for `validation_failed`; one entry per invalid field.
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          description: Path of the field in the request, for example `admin.email`.
        message:
          type: string
    SetupStatus:
      type: object
      additionalProperties: false
      required: [setupRequired, secureConnection, domainFromEnvironment]
      properties:
        setupRequired:
          type: boolean
          description: True until the first admin has been created.
        secureConnection:
          type: boolean
          description: |
            True when this request arrived over HTTPS (directly or via a
            trusted proxy) or is addressed to localhost.
        domain:
          type: string
          description: The configured public domain, if any.
        domainFromEnvironment:
          type: boolean
          description: True when `DOMAIN` is set in `.env`, so the wizard cannot change it.
    SetupRequest:
      type: object
      additionalProperties: false
      required: [setupToken, admin, instance]
      properties:
        setupToken:
          type: string
          description: The token from the server logs. Case and dashes are ignored.
        admin:
          $ref: "#/components/schemas/SetupAdmin"
        instance:
          $ref: "#/components/schemas/SetupInstance"
    SetupAdmin:
      type: object
      additionalProperties: false
      required: [username, displayName, email, password]
      properties:
        username:
          type: string
          description: 3–32 characters from a–z, 0–9, `_` and `.`.
        displayName:
          type: string
          description: 1–32 characters.
        email:
          type: string
        password:
          type: string
          description: At least 10 characters.
    SetupInstance:
      type: object
      additionalProperties: false
      required: [name, registrationMode]
      properties:
        name:
          type: string
          description: Instance name shown to users, 1–64 characters.
        domain:
          type: string
          description: Public domain such as `chat.example.com`. Ignored when `DOMAIN` is set in `.env`.
        registrationMode:
          $ref: "#/components/schemas/RegistrationMode"
    RegistrationMode:
      type: string
      enum: [open, invite_only, closed]
      description: Who may create accounts.
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, displayName, email, password, deviceName]
      properties:
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
        password:
          type: string
        inviteCode:
          type: string
          description: Required when registration is invite-only.
        deviceName:
          type: string
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
    CompletePasswordResetRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
    CreateInviteRequest:
      type: object
      additionalProperties: false
      properties:
        maxUses:
          type: integer
          format: int32
          minimum: 1
          description: How many accounts may use the invite. Omit for no limit.
        expiresAt:
          type: string
          format: date-time
          description: When the invite stops working. Omit for never.
    Invite:
      type: object
      additionalProperties: false
      required: [id, uses, createdAt]
      properties:
        id:
          type: string
          format: uuid
        maxUses:
          type: integer
          format: int32
        uses:
          type: integer
          format: int32
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    CreatedInvite:
      type: object
      additionalProperties: false
      required: [id, code]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: The invite code. Shown only this once.
    MfaChallenge:
      type: object
      additionalProperties: false
      required: [challengeToken, methods]
      properties:
        challengeToken:
          type: string
        methods:
          type: array
          items:
            $ref: "#/components/schemas/MfaMethod"
    MfaMethod:
      type: string
      enum: [totp, security_key, backup_code]
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required: [challengeToken, method, code, deviceName]
      properties:
        challengeToken:
          type: string
        method:
          $ref: "#/components/schemas/MfaMethod"
        code:
          type: string
        deviceName:
          type: string
    SecondFactors:
      type: object
      additionalProperties: false
      required: [authenticators, backupCodesRemaining]
      properties:
        authenticators:
          type: array
          items:
            $ref: "#/components/schemas/Authenticator"
        backupCodesRemaining:
          type: integer
          format: int64
    Authenticator:
      type: object
      additionalProperties: false
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    EnrollTotpRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          description: A label such as "Phone", 1–64 characters.
    TotpEnrollment:
      type: object
      additionalProperties: false
      required: [enrollmentId, secret, otpauthUrl]
      properties:
        enrollmentId:
          type: string
          format: uuid
        secret:
          type: string
          description: Base32 secret, for typing into an app by hand.
        otpauthUrl:
          type: string
          description: Show this as a QR code.
    CodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
    TotpConfirmation:
      type: object
      additionalProperties: false
      properties:
        backupCodes:
          type: array
          items:
            type: string
          description: Present only when this is the first second factor.
    BackupCodes:
      type: object
      additionalProperties: false
      required: [codes]
      properties:
        codes:
          type: array
          items:
            type: string
    ChallengeRequest:
      type: object
      additionalProperties: false
      required: [challengeToken]
      properties:
        challengeToken:
          type: string
    WebAuthnCeremony:
      type: object
      additionalProperties: false
      required: [ceremonyId, options]
      properties:
        ceremonyId:
          type: string
          format: uuid
        options:
          type: object
          additionalProperties: true
          description: WebAuthn options, as defined by the W3C WebAuthn specification.
    WebAuthnLoginAnswer:
      type: object
      additionalProperties: false
      required: [ceremonyId, credential, deviceName]
      properties:
        ceremonyId:
          type: string
          format: uuid
        credential:
          type: object
          additionalProperties: true
          description: The PublicKeyCredential from the browser, serialized as JSON.
        deviceName:
          type: string
    WebAuthnRegistrationRequest:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind:
          $ref: "#/components/schemas/WebAuthnKind"
        name:
          type: string
    WebAuthnRegistrationAnswer:
      type: object
      additionalProperties: false
      required: [ceremonyId, kind, credential]
      properties:
        ceremonyId:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/WebAuthnKind"
        credential:
          type: object
          additionalProperties: true
    WebAuthnKind:
      type: string
      enum: [passkey, security_key]
      description: A passkey replaces the password; a security key is a second factor after it.
    WebAuthnCredential:
      type: object
      additionalProperties: false
      required: [id, kind, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/WebAuthnKind"
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, password, deviceName]
      properties:
        login:
          type: string
          description: Username or email address.
        password:
          type: string
        deviceName:
          type: string
          description: Shown in the session list, for example "Firefox on Linux". 1–64 characters.
    LoginResult:
      type: object
      additionalProperties: false
      required: [token, session, user]
      properties:
        token:
          type: string
          description: "Session token. Send it as `Authorization: Bearer <token>`. It is shown only once."
        session:
          $ref: "#/components/schemas/Session"
        user:
          $ref: "#/components/schemas/CurrentUser"
    Session:
      type: object
      additionalProperties: false
      required: [id, deviceName, createdAt, lastSeenAt, expiresAt, current]
      properties:
        id:
          type: string
          format: uuid
        deviceName:
          type: string
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: True for the session making this request.
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, username, displayName, email, emailVerified, isInstanceAdmin]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
        isInstanceAdmin:
          type: boolean
    SetupResult:
      type: object
      additionalProperties: false
      required: [adminUserId]
      properties:
        adminUserId:
          type: string
          format: uuid
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          $ref: "#/components/schemas/HealthState"
        checks:
          type: array
          description: One entry per dependency. Empty for the liveness probe.
          items:
            $ref: "#/components/schemas/HealthCheck"
    HealthCheck:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          description: Dependency name, for example `database`.
          example: database
        status:
          $ref: "#/components/schemas/HealthState"
    HealthState:
      type: string
      enum: [ok, unavailable]
    InstanceInfo:
      type: object
      additionalProperties: false
      required: [name, registrationMode, secureConnection]
      properties:
        name:
          type: string
        domain:
          type: string
          description: The public domain, once one is set.
        registrationMode:
          $ref: "#/components/schemas/RegistrationMode"
        secureConnection:
          type: boolean
          description: |
            True when this request arrived over HTTPS (directly or via a
            trusted proxy) or is addressed to localhost.
    TlsStatus:
      type: object
      additionalProperties: false
      required: [active]
      properties:
        active:
          type: boolean
          description: True while the server serves HTTPS with its own certificate.
        names:
          type: array
          description: The domain names the certificate covers.
          items:
            type: string
        issuer:
          type: string
        expiresAt:
          type: string
          format: date-time
    InstallTlsCertificateRequest:
      type: object
      additionalProperties: false
      required: [certificate, privateKey]
      properties:
        certificate:
          type: string
          description: PEM certificate chain, leaf first, including intermediates.
        privateKey:
          type: string
          description: PEM private key of the leaf certificate.
    SmtpSecurity:
      type: string
      description: |
        `starttls` (usually port 587) and `tls` (usually port 465) encrypt
        the connection; `none` is only for a relay on the same network.
      enum: [starttls, tls, none]
    SmtpSettings:
      type: object
      additionalProperties: false
      required: [configured, host, port, security, username, from, passwordSet]
      properties:
        configured:
          type: boolean
          description: True once a mail server is set, so the server can send email.
        host:
          type: string
        port:
          type: integer
          format: int32
        security:
          $ref: "#/components/schemas/SmtpSecurity"
        username:
          type: string
        from:
          type: string
        passwordSet:
          type: boolean
    UpdateSmtpSettingsRequest:
      type: object
      additionalProperties: false
      required: [host, port, security, from]
      properties:
        host:
          type: string
        port:
          type: integer
          format: int32
        security:
          $ref: "#/components/schemas/SmtpSecurity"
        username:
          type: string
        password:
          type: string
          description: Leave out to keep the stored password; empty to remove it.
        from:
          type: string
          description: The sender address, for example `chat@example.com`.
    SignInProvider:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          type: string
        displayName:
          type: string
    BeginProviderSignInRequest:
      type: object
      additionalProperties: false
      required: [returnTo]
      properties:
        returnTo:
          type: string
          description: |
            Where the browser goes afterwards: a path on this instance (web
            and desktop, for example `/login/oidc`) or a `nexuschat://`
            address (mobile apps).
        inviteCode:
          type: string
          description: Used if the sign-in creates an account on an invite-only instance.
    BeginProviderLinkRequest:
      type: object
      additionalProperties: false
      required: [returnTo]
      properties:
        returnTo:
          type: string
          description: As for `begin`.
    ProviderFlow:
      type: object
      additionalProperties: false
      required: [flowId, authorizationUrl]
      properties:
        flowId:
          type: string
          format: uuid
          description: Keep this in memory; completing needs it.
        authorizationUrl:
          type: string
    CompleteProviderSignInRequest:
      type: object
      additionalProperties: false
      required: [flowId, code, deviceName]
      properties:
        flowId:
          type: string
          format: uuid
        code:
          type: string
          description: The `code` from the return address's fragment.
        deviceName:
          type: string
          description: Shown in the session list. 1–64 characters.
    CompleteProviderLinkRequest:
      type: object
      additionalProperties: false
      required: [flowId, code]
      properties:
        flowId:
          type: string
          format: uuid
        code:
          type: string
    LinkedProvider:
      type: object
      additionalProperties: false
      required: [providerId, displayName, email, linkedAt]
      properties:
        providerId:
          type: string
        displayName:
          type: string
        email:
          type: string
          description: The email the provider shared when it was linked (may be empty).
        linkedAt:
          type: string
          format: date-time
    OidcProviderList:
      type: object
      additionalProperties: false
      required: [providers]
      properties:
        callbackUrl:
          type: string
          description: The redirect URI to register at each provider; missing until a domain is set.
        providers:
          type: array
          items:
            $ref: "#/components/schemas/OidcProvider"
    OidcProvider:
      type: object
      additionalProperties: false
      required: [id, displayName, issuer, clientId, clientSecretSet, scopes, allowSignup]
      properties:
        id:
          type: string
        displayName:
          type: string
        issuer:
          type: string
        clientId:
          type: string
        clientSecretSet:
          type: boolean
        scopes:
          type: array
          items:
            type: string
        allowSignup:
          type: boolean
          description: Whether a first sign-in creates an account (following the registration mode).
    CreateOidcProviderRequest:
      type: object
      additionalProperties: false
      required: [id, displayName, issuer, clientId, allowSignup]
      properties:
        id:
          type: string
          description: 2–32 lower-case letters, digits or dashes; used in URLs and cannot change.
        displayName:
          type: string
          description: Shown on the login button, for example "Company login". 1–64 characters.
        issuer:
          type: string
          description: The issuer URL, for example `https://login.example.com/realms/staff`.
        clientId:
          type: string
        clientSecret:
          type: string
          description: Leave out for a public client.
        scopes:
          type: array
          description: Defaults to `openid email profile`; `openid` is always added.
          items:
            type: string
        allowSignup:
          type: boolean
    UpdateOidcProviderRequest:
      type: object
      additionalProperties: false
      required: [displayName, issuer, clientId, allowSignup]
      properties:
        displayName:
          type: string
        issuer:
          type: string
        clientId:
          type: string
        clientSecret:
          type: string
          description: Leave out to keep the stored secret; empty to remove it.
        scopes:
          type: array
          items:
            type: string
        allowSignup:
          type: boolean
