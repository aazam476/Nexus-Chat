openapi: 3.0.3
info:
  title: Nexus Chat Server API
  version: 0.1.0
  description: |
    The HTTP API of a Nexus Chat instance. This file is the contract: Go
    server interfaces and the TypeScript client are generated from it.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /
tags:
  - name: health
    description: Liveness and readiness probes used by Docker and orchestrators.
  - name: setup
    description: First-run setup of a fresh instance (spec §3.5).
  - name: auth
    description: Logging in and out, and managing sessions (spec §4.1).
  - name: users
    description: User accounts and profiles.
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Log in with a password
      description: |
        Checks the username (or email) and password and starts a session.
        After repeated wrong passwords the account is locked for a short,
        growing time; the response then has code `login_delayed` and a
        `Retry-After` header.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The username or password is wrong (`invalid_credentials`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many attempts from this address (`rate_limited`) or for this account (`login_delayed`).
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Log out
      description: Ends the session used for this request.
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/sessions:
    get:
      operationId: listSessions
      summary: List my sessions
      description: Every device where this account is logged in, most recently used first.
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      summary: Revoke a session
      description: Logs out one of my devices.
      tags: [auth]
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The session has ended.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such session for this account (`session_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      summary: My account
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The logged-in account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/setup:
    get:
      operationId: getSetupStatus
      summary: Setup status
      description: |
        Tells the setup wizard whether the instance still needs setting up,
        and whether this connection is secure (HTTPS or localhost), so it can
        warn that the setup token and password would travel unencrypted.
      tags: [setup]
      responses:
        "200":
          description: Current setup status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
    post:
      operationId: completeSetup
      summary: Complete setup
      description: |
        Creates the first instance admin and saves the basic instance
        settings. Requires the one-time setup token printed in the server
        logs on first boot. Works once; afterwards it returns 409.
      tags: [setup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Setup is complete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The setup token is wrong (`invalid_setup_token`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Setup was already completed (`setup_already_complete`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /healthz:
    get:
      operationId: getLiveness
      summary: Liveness probe
      description: Returns 200 whenever the process is running and serving HTTP.
      tags: [health]
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Returns 200 when every dependency the server needs (currently the
        database) is reachable, and 503 otherwise.
      tags: [health]
      responses:
        "200":
          description: The server is ready to take traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: At least one dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "A session token from `POST /api/v1/auth/login`, sent as `Authorization: Bearer nxs_…`."
  responses:
    Unauthorized:
      description: The request has no valid session token (`unauthorized`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The request body is not valid JSON or has the wrong shape (`bad_request`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: One or more fields are invalid (`validation_failed`); `fields` lists them.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many attempts; try again later (`rate_limited`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code, for example `validation_failed`.
        message:
          type: string
          description: Human-readable explanation in English.
        fields:
          type: array
          description: Present for `validation_failed`; one entry per invalid field.
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          description: Path of the field in the request, for example `admin.email`.
        message:
          type: string
    SetupStatus:
      type: object
      additionalProperties: false
      required: [setupRequired, secureConnection, domainFromEnvironment]
      properties:
        setupRequired:
          type: boolean
          description: True until the first admin has been created.
        secureConnection:
          type: boolean
          description: |
            True when this request arrived over HTTPS (directly or via a
            trusted proxy) or is addressed to localhost.
        domain:
          type: string
          description: The configured public domain, if any.
        domainFromEnvironment:
          type: boolean
          description: True when `DOMAIN` is set in `.env`, so the wizard cannot change it.
    SetupRequest:
      type: object
      additionalProperties: false
      required: [setupToken, admin, instance]
      properties:
        setupToken:
          type: string
          description: The token from the server logs. Case and dashes are ignored.
        admin:
          $ref: "#/components/schemas/SetupAdmin"
        instance:
          $ref: "#/components/schemas/SetupInstance"
    SetupAdmin:
      type: object
      additionalProperties: false
      required: [username, displayName, email, password]
      properties:
        username:
          type: string
          description: 3–32 characters from a–z, 0–9, `_` and `.`.
        displayName:
          type: string
          description: 1–32 characters.
        email:
          type: string
        password:
          type: string
          description: At least 10 characters.
    SetupInstance:
      type: object
      additionalProperties: false
      required: [name, registrationMode]
      properties:
        name:
          type: string
          description: Instance name shown to users, 1–64 characters.
        domain:
          type: string
          description: Public domain such as `chat.example.com`. Ignored when `DOMAIN` is set in `.env`.
        registrationMode:
          $ref: "#/components/schemas/RegistrationMode"
    RegistrationMode:
      type: string
      enum: [open, invite_only, closed]
      description: Who may create accounts.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, password, deviceName]
      properties:
        login:
          type: string
          description: Username or email address.
        password:
          type: string
        deviceName:
          type: string
          description: Shown in the session list, for example "Firefox on Linux". 1–64 characters.
    LoginResult:
      type: object
      additionalProperties: false
      required: [token, session, user]
      properties:
        token:
          type: string
          description: "Session token. Send it as `Authorization: Bearer <token>`. It is shown only once."
        session:
          $ref: "#/components/schemas/Session"
        user:
          $ref: "#/components/schemas/CurrentUser"
    Session:
      type: object
      additionalProperties: false
      required: [id, deviceName, createdAt, lastSeenAt, expiresAt, current]
      properties:
        id:
          type: string
          format: uuid
        deviceName:
          type: string
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: True for the session making this request.
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, username, displayName, email, emailVerified, isInstanceAdmin]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
        isInstanceAdmin:
          type: boolean
    SetupResult:
      type: object
      additionalProperties: false
      required: [adminUserId]
      properties:
        adminUserId:
          type: string
          format: uuid
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          $ref: "#/components/schemas/HealthState"
        checks:
          type: array
          description: One entry per dependency. Empty for the liveness probe.
          items:
            $ref: "#/components/schemas/HealthCheck"
    HealthCheck:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          description: Dependency name, for example `database`.
          example: database
        status:
          $ref: "#/components/schemas/HealthState"
    HealthState:
      type: string
      enum: [ok, unavailable]
