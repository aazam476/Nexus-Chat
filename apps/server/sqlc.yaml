# sqlc compiles the SQL in each feature's store/queries.sql into typed Go.
# Run `go generate ./...` from apps/server after changing a query or migration.
version: "2"
sql:
  - engine: postgresql
    schema: internal/platform/database/migrations
    queries: internal/instanceconfig/store/queries.sql
    gen:
      go: &go-options
        package: store
        out: internal/instanceconfig/store
        sql_package: pgx/v5
        output_files_suffix: .gen
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        emit_interface: false
        # Plain Go types read more easily than pgtype wrappers: nullable
        # columns become pointers (*string, *time.Time).
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
  - engine: postgresql
    schema: internal/platform/database/migrations
    queries: internal/accounts/store/queries.sql
    gen:
      go:
        <<: *go-options
        out: internal/accounts/store
  - engine: postgresql
    schema: internal/platform/database/migrations
    queries: internal/auth/session/store/queries.sql
    gen:
      go:
        <<: *go-options
        out: internal/auth/session/store
  - engine: postgresql
    schema: internal/platform/database/migrations
    queries: internal/accounts/tokens/store/queries.sql
    gen:
      go:
        <<: *go-options
        out: internal/accounts/tokens/store
  - engine: postgresql
    schema: internal/platform/database/migrations
    queries: internal/registration/store/queries.sql
    gen:
      go:
        <<: *go-options
        out: internal/registration/store
  - engine: postgresql
    schema: internal/platform/database/migrations
    queries: internal/auth/mfa/store/queries.sql
    gen:
      go:
        <<: *go-options
        out: internal/auth/mfa/store
  - engine: postgresql
    schema: internal/platform/database/migrations
    queries: internal/auth/passkeys/store/queries.sql
    gen:
      go:
        <<: *go-options
        out: internal/auth/passkeys/store
  - engine: postgresql
    schema: internal/platform/database/migrations
    queries: internal/auth/oidc/store/queries.sql
    gen:
      go:
        <<: *go-options
        out: internal/auth/oidc/store
  - engine: postgresql
    schema: internal/platform/database/migrations
    queries: internal/keypackages/store/queries.sql
    gen:
      go:
        <<: *go-options
        out: internal/keypackages/store
