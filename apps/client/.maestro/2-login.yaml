# Password login: a wrong password is explained, the right one reaches the
# home screen with live presence, and logging out returns to the login.
appId: org.nexuschat.app
---
- runFlow: common/connect.yaml
- scrollUntilVisible:
    element:
      id: "login-submit"
- runFlow: { file: common/fill.yaml, env: { FIELD: "login-name", TEXT: "admin" } }
- runFlow: { file: common/fill.yaml, env: { FIELD: "login-password", TEXT: "not the password" } }
- scrollUntilVisible:
    element:
      id: "login-submit"
- tapOn:
    id: "login-submit"
- scrollUntilVisible:
    element:
      text: "The username or password is wrong."
    direction: UP
- scrollUntilVisible:
    element:
      id: "login-password"
    centerElement: true
- tapOn:
    id: "login-password"
- eraseText
- inputText: ${PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "login-submit"
- tapOn:
    id: "login-submit"
- assertVisible: "Welcome, .*Ada Admin.*"
- assertVisible: "Others see you as: Online"
- scrollUntilVisible:
    element:
      id: "logout"
- tapOn:
    id: "logout"
- scrollUntilVisible:
    element:
      id: "login-submit"
