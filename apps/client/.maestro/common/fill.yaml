# Types ${TEXT} into the field with test ID ${FIELD}, scrolling to it first.
# On a slow emulator a tap can land while the previous field still holds
# focus, and the text would go there; the tap is repeated until this field
# has focus.
appId: org.nexuschat.app
---
- scrollUntilVisible:
    element:
      id: ${FIELD}
    centerElement: true
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: ${FIELD}
      - assertVisible:
          id: ${FIELD}
          focused: true
- inputText: ${TEXT}
- hideKeyboard
