# A second user signs up, lands on the home screen and gets a recovery phrase.
appId: org.nexuschat.app
---
- runFlow: common/connect.yaml
- scrollUntilVisible:
    element:
      id: "go-register"
- tapOn:
    id: "go-register"
- runFlow: { file: common/fill.yaml, env: { FIELD: "register-username", TEXT: "grace" } }
- runFlow: { file: common/fill.yaml, env: { FIELD: "register-displayName", TEXT: "Grace Member" } }
- runFlow: { file: common/fill.yaml, env: { FIELD: "register-email", TEXT: "grace@example.com" } }
- runFlow: { file: common/fill.yaml, env: { FIELD: "register-password", TEXT: "second user password" } }
- scrollUntilVisible:
    element:
      id: "register-submit"
- tapOn:
    id: "register-submit"
- assertVisible: "Welcome, .*Grace Member.*"
# Encryption is set up on the device (native WebCrypto under Hermes): the
# new user is asked to write down their recovery phrase.
- scrollUntilVisible:
    element:
      id: "messaging-next-step"
    timeout: 60000
- tapOn:
    id: "messaging-next-step"
- assertVisible: "Write down your recovery phrase"
